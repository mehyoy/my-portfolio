function pushRemote(){

}

function initDb(){
  try{
    if(!window.claude||!window.claude.use) return;
    Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
      var db=r[0],user=r[1];
      if(!db||!user) return null;
      return user.id().then(function(id){
        if(!id) return null;
        var d=db.doc('data/users/'+id+'/state');
        ref=d;
        var first=true;
        d.onSnapshot(function(snap){
          var fromCache=snap.metadata&&snap.metadata.fromCache;
          var data=snap.exists?snap.data():null;
          if(data&&data.v===1&&(data.updated||0)>(S.updated||0)){
            sync='cloud';
            applyRemote(data);
          }else if(!fromCache){
            sync='cloud';
            if(S.updated>0&&(!data||(data.updated||0)<S.updated)&&first) queueRemote();
          }
          if(!fromCache) first=false;
          updateSyncUI();
        },function(){ref=null;sync='local';updateSyncUI();});
      });
    }).catch(function(){});
  }catch(e){}
}
function pushSupported(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;}

    var on=!!sub&&Notification.permission==='granted';

function enablePush(){

    if(perm!=='granted'){toast('Notifications were not allowed');if(ui.sheet==='settings') renderSheet();return null;}
    return navigator.serviceWorker.ready.then(function(reg){
      return reg.pushManager.getSubscription().then(function(sub){
        return sub||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID_PUBLIC)});
      });
    }).then(function(sub){return saveDevice(sub);}).then(function(){
      pushOn=true;deviceSynced=true;

/* ---------- derived ---------- */
function inView(g){
  var t=today();
  if(view==='all') return true;
  if(!g.done&&g.due<t) return true;
  if(g.due<t) return false;
  if(view==='today') return g.due===t;
  if(view==='week') return g.due<=weekEnd(t);
  return g.due<=monthEnd(t);
}
function groups(list){
  var t=today(),we=weekEnd(t),me=monthEnd(t);
  var G=[['Overdue',[]],['Today',[]],['This week',[]],['This month',[]],['Later',[]],['Completed',[]]];
  list.forEach(function(g){
    if(g.done) G[5][1].push(g);
    else if(g.due<t) G[0][1].push(g);
    else if(g.due===t) G[1][1].push(g);
    else if(g.due<=we) G[2][1].push(g);
    else if(g.due<=me) G[3][1].push(g);
    else G[4][1].push(g);
  });
  for(var i=0;i<5;i++) G[i][1].sort(byDue);
  G[5][1].sort(function(a,b){return (b.doneAt||0)-(a.doneAt||0);});
  return G.filter(function(x){return x[1].length;});
}
function pending(){
  var t=today();
  return S.goals.filter(function(g){
    if(g.done) return false;
    var l=lastCheck(g);
    if(l&&iso(new Date(l.ts))===t) return false;
    if(g.created===t&&g.due>t) return false;
    var until=diff(t,g.due);
    var since=l?diff(iso(new Date(l.ts)),t):diff(g.created,t);
    return until<=7||since>=7;
  }).sort(byDue);
}
function dueText(g){
  var t=today(),n=diff(t,g.due);
  if(g.done) return fmtShort(g.due);
  if(n<0) return (-n)+' '+plural(-n,'day','days')+' overdue';
  if(n===0) return 'Today';
  if(n===1) return 'Tomorrow';
  var rel=n<14?'in '+n+' days':n<60?'in '+Math.round(n/7)+' wks':'in '+Math.round(n/30)+' mo';
  return fmtShort(g.due)+' · '+rel;
}
function ago(ts){
  var n=diff(iso(new Date(ts)),today());
  return n===0?'today':n===1?'yesterday':n+'d ago';
}

function ringSVG(p){

function nudgeHTML(){

function render(){

  h+='<div class="actions">'+
    (g.done?'<button type="button" class="btn" data-act="reopen">Reopen</button>':'<button type="button" class="btn" data-act="done">Mark done</button>')+
    '<button type="button" class="btn danger" id="del-btn" data-act="del">'+(ui.confirm===g.id?'Tap again to delete':'Delete')+'</button></div>';
  return h;
}
function sheetFlow(){
  var f=ui.flow,n=f.ids.length;
  var head=function(t){return '<div class="sh-head"><div><span class="eyebrow">'+t+'</span></div><button type="button" class="icon-btn sm" data-act="close" aria-label="Close">'+I.x+'</button></div>';};
  if(n===0){
    var active=S.goals.filter(function(g){return !g.done;}).length;
    return head('Check-in')+'<div class="center"><h2 id="sh-title" class="flow-t">You are all caught up</h2><p>'+(active?'Every goal that needs an update has one today.':'Add a goal first, then check in on it here.')+'</p>'+
      (active?'<button type="button" class="btn" data-act="flow-all">Check in on all active goals</button>':'<button type="button" class="btn primary" data-act="add">New goal</button>')+'</div>';
  }
  if(f.i>=n){
    var t=today(),hasTomorrow=S.goals.some(function(g){return g.due===addDays(t,1);});
    return head('Check-in')+'<div class="center"><h2 id="sh-title" class="flow-t">Done for now</h2><p>You checked in on '+f.logged+' '+plural(f.logged,'goal','goals')+'.</p>'+
      (hasTomorrow?'':'<button type="button" class="btn primary" data-act="nudge-add" data-when="tomorrow">Set tomorrow’s goals</button>')+
      '<button type="button" class="btn" data-act="close">Close</button></div>';
  }
  var g=byId(f.ids[f.i]);
  if(!g){f.i++;return sheetFlow();}
  var steps='<div class="steps" aria-hidden="true">'+f.ids.map(function(_,i){return '<span class="'+(i<=f.i?'on':'')+'"></span>';}).join('')+'</div>';
  return head('Check-in · '+(f.i+1)+' of '+n)+steps+
    '<h2 id="sh-title" class="flow-t">'+esc(g.title)+'</h2><div class="gm" style="margin-bottom:16px"><span class="due">'+esc(dueText(g))+'</span></div>'+
    '<div class="lbl" style="margin:0 0 10px">How is it going?</div><div class="presets">'+STATUS.map(function(s){return presetBtn(s,'flow-pick',null);}).join('')+'</div>'+
    '<div class="actions" style="grid-template-columns:1fr 1fr"><button type="button" class="btn" data-act="flow-skip">Skip</button><button type="button" class="btn" data-act="flow-done">Mark done</button></div>';
}
function sheetSettings(){
  var hasEx=S.goals.some(function(g){return g.example;});
  return '<div class="sh-head"><h2 id="sh-title">Reminders</h2><button type="button" class="icon-btn sm" data-act="close" aria-label="Close">'+I.x+'</button></div>'+
    '<div class="setrow"><label for="set-plan"><b>Plan my day</b><span>Prompt to set goals</span></label><input id="set-plan" class="inp" type="time" value="'+esc(S.settings.plan)+'"></div>'+
    '<div class="setrow"><label for="set-check"><b>Check in</b><span>Prompt to log progress</span></label><input id="set-check" class="inp" type="time" value="'+esc(S.settings.check)+'"></div>'+
    '<p class="note">These times set when Waypoints prompts you in the app and when notifications are sent.</p>'+
    accountRow()+pushSection()+'<div class="sync"><i class="dot" style="--s:var(--s3)"></i><span id="sync-t">'+esc(syncLabel())+'</span></div>'+
    (hasEx?'<div class="actions" style="grid-template-columns:1fr"><button type="button" class="btn" data-act="rm-examples">Remove example goals</button></div>':'');
}
function renderSheet(){
  var h='';
  if(ui.sheet==='add') h=sheetAdd();
  else if(ui.sheet==='goal'){var g=byId(ui.id);if(!g){closeSheet();return;}h=sheetGoal(g);}
  else if(ui.sheet==='flow') h=sheetFlow();
  else if(ui.sheet==='settings') h=sheetSettings();
  else if(ui.sheet==='signin') h=sheetSignin();
  $('#sheet-body').innerHTML=h;
}
function openSheet(type,data){
  if(!ui.sheet) ui.lastFocus=document.activeElement;
  ui.sheet=type;
  ui.pick=null;ui.confirm=null;
  if(data) Object.keys(data).forEach(function(k){ui[k]=data[k];});
  $('#layer').hidden=false;
  document.documentElement.classList.add('lock');
  renderSheet();
  var sh=$('#sheet');sh.scrollTop=0;
  var f=type==='add'?$('#add-title'):null;
  (f||sh).focus({preventScroll:true});
}
function closeSheet(){
  ui.sheet=null;ui.pick=null;ui.confirm=null;ui.flow=null;
  $('#layer').hidden=true;
  document.documentElement.classList.remove('lock');
  render();
  var lf=ui.lastFocus;
  if(lf&&lf.focus&&document.contains(lf)){try{lf.focus({preventScroll:true});}catch(e){}}
}
function openFlow(all){
  var ids=(all?S.goals.filter(function(g){return !g.done;}).sort(byDue):pending()).map(function(g){return g.id;});
  openSheet('flow',{flow:{ids:ids,i:0,logged:0}});
}

var toastT=0;
function toast(msg){
  var t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2400);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el) return;
  var a=el.dataset.act;
  if(a==='view'){view=el.dataset.v;render();}
  else if(a==='add'){openSheet('add',{addWhen:'today'});}
  else if(a==='nudge-add'){openSheet('add',{addWhen:el.dataset.when||'today'});}
  else if(a==='flow'){openFlow(false);}
  else if(a==='flow-all'){openFlow(true);}
  else if(a==='settings'){openSheet('settings');refreshPush();}
  else if(a==='close'){closeSheet();}
  else if(a==='open'){openSheet('goal',{id:el.dataset.id});}
  else if(a==='when'){
    ui.addWhen=el.dataset.w;
    Array.prototype.forEach.call(document.querySelectorAll('.chip[data-act="when"]'),function(c){c.setAttribute('aria-pressed',c.dataset.w===ui.addWhen?'true':'false');});
    $('#date-wrap').hidden=ui.addWhen!=='pick';
    $('#when-res').textContent=whenText(ui.addWhen,$('#add-date').value);
    if(ui.addWhen==='pick') $('#add-date').focus();
  }
  else if(a==='pick'){
    ui.pick=el.dataset.k;
    Array.prototype.forEach.call(document.querySelectorAll('.preset[data-act="pick"]'),function(c){c.setAttribute('aria-pressed',c.dataset.k===ui.pick?'true':'false');});
    $('#note-wrap').hidden=false;
    $('#log-btn').disabled=false;
  }
  else if(a==='log'){
    var g=byId(ui.id);if(!g||!ui.pick) return;
    var note=($('#c-note').value||'').trim(),k=ui.pick;
    mutate(function(){g.checkins.push({ts:Date.now(),s:k,n:note});});
    ui.pick=null;renderSheet();
    toast('Checked in: '+SBY[k].label);
  }
  else if(a==='done'||a==='flow-done'){
    var gd=a==='done'?byId(ui.id):byId(ui.flow.ids[ui.flow.i]);
    if(!gd) return;
    mutate(function(){gd.done=true;gd.doneAt=Date.now();});
    toast('Marked done. Nice work.');
    if(a==='done') closeSheet();
    else{ui.flow.i++;ui.flow.logged++;renderSheet();$('#sheet').focus({preventScroll:true});}
  }
  else if(a==='reopen'){
    var gr=byId(ui.id);if(!gr) return;
    mutate(function(){gr.done=false;delete gr.doneAt;});
    renderSheet();toast('Goal reopened');
  }
  else if(a==='del'){
    var gx=byId(ui.id);if(!gx) return;
    if(ui.confirm===gx.id){
      mutate(function(){S.goals=S.goals.filter(function(g){return g.id!==gx.id;});});
      closeSheet();toast('Goal deleted');
    }else{
      ui.confirm=gx.id;el.textContent='Tap again to delete';
      setTimeout(function(){if(ui.confirm===gx.id&&ui.sheet==='goal'){ui.confirm=null;var b=$('#del-btn');if(b) b.textContent='Delete';}},4000);
    }
  }
  else if(a==='flow-pick'){
    var gf=byId(ui.flow.ids[ui.flow.i]);if(!gf) return;
    var kk=el.dataset.k;
    mutate(function(){gf.checkins.push({ts:Date.now(),s:kk,n:''});});
    ui.flow.i++;ui.flow.logged++;renderSheet();
    $('#sheet').scrollTop=0;$('#sheet').focus({preventScroll:true});
  }
  else if(a==='flow-skip'){ui.flow.i++;renderSheet();$('#sheet').focus({preventScroll:true});}
  else if(a==='push-on'){enablePush();}
  else if(a==='push-test'){sendTest();}
  else if(a==='push-off'){disablePush();}
  else if(a==='signin'){openSheet('signin',{confirmLink:false});}
  else if(a==='google'){
    if(!auth) return;
    var gp=new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(gp).catch(function(err){
      var cd=err&&err.code;
      if(cd==='auth/popup-blocked') auth.signInWithRedirect(gp);
      else if(cd==='auth/unauthorized-domain') siMsg('This site is not authorized for sign-in yet. Add its domain under Authentication, Settings, Authorized domains in Firebase.',true);
      else if(cd!=='auth/popup-closed-by-user'&&cd!=='auth/cancelled-popup-request') siMsg('Google sign-in did not complete. Try again.',true);
    });
  }
  else if(a==='email-send'){
    if(!auth) return;
    var em2=($('#si-email').value||'').trim();
    if(!/^\S+@\S+\.\S+$/.test(em2)){siMsg('Enter a valid email address.',true);return;}
    if(ui.confirmLink){finishEmail(em2);return;}
    auth.sendSignInLinkToEmail(em2,{url:location.origin+location.pathname,handleCodeInApp:true}).then(function(){
      try{localStorage.setItem('waypoints.email',em2);}catch(e){}
      siMsg('Check '+em2+' for your sign-in link.',false);
    }).catch(function(){siMsg('Could not send the link. Check the address and try again.',true);});
  }
  else if(a==='signout'){
    if(!auth) return;
    var did=deviceId();
    (fs?fs.collection('devices').doc(did).delete().catch(function(){}):Promise.resolve()).then(function(){return auth.signOut();}).then(function(){
      pushOn=false;
      S=seed();try{localStorage.removeItem(KEY);}catch(e){}
      closeSheet();toast('Signed out');
    });
  }
  else if(a==='rm-examples'){
    mutate(function(){S.goals=S.goals.filter(function(g){return !g.example;});});
    if(ui.sheet==='settings') renderSheet();
    toast('Example goals removed');
  }
});

document.addEventListener('submit',function(e){
  if(e.target.id!=='add-form') return;
  e.preventDefault();
  var title=$('#add-title').value.trim(),err=$('#add-err');
  var date=whenDate(ui.addWhen,$('#add-date').value);
  function fail(msg,focusEl){err.textContent=msg;err.hidden=false;focusEl.setAttribute('aria-invalid','true');focusEl.focus();}
  $('#add-title').removeAttribute('aria-invalid');$('#add-date').removeAttribute('aria-invalid');err.hidden=true;
  if(!title){fail('Give your goal a name.',$('#add-title'));return;}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){fail('Pick a date for this goal.',$('#add-date'));return;}
  var notes=$('#add-notes').value.trim();
  mutate(function(){S.goals.push({id:uid(),title:title,due:date,created:today(),notes:notes,checkins:[],done:false});});
  $('#add-title').value='';$('#add-notes').value='';$('#add-title').focus();
  toast('Added for '+fmtShort(date));
});

document.addEventListener('input',function(e){
  if(e.target.id==='add-date'&&ui.sheet==='add') $('#when-res').textContent=whenText('pick',e.target.value);
});

document.addEventListener('change',function(e){
  var t=e.target,g;
  if(t.id==='g-title'){
    g=byId(ui.id);if(!g) return;
    var v=t.value.trim();
    if(!v){t.value=g.title;return;}
    mutate(function(){g.title=v;});
  }else if(t.id==='g-date'){
    g=byId(ui.id);if(!g) return;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(t.value)){t.value=g.due;return;}
    mutate(function(){g.due=t.value;});
  }else if(t.id==='g-notes'){
    g=byId(ui.id);if(!g) return;
    mutate(function(){g.notes=t.value.trim();});
  }else if(t.id==='set-nm'||t.id==='set-ne'){
    mutate(function(){S.settings[t.id==='set-nm'?'notifMorning':'notifEvening']=t.checked;});
  }else if(t.id==='set-plan'||t.id==='set-check'){
    if(!t.value) return;
    mutate(function(){S.settings[t.id==='set-plan'?'plan':'check']=t.value;});
  }
});

document.addEventListener('keydown',function(e){
  if(!ui.sheet) return;
  if(e.key==='Escape'){closeSheet();return;}
  if(e.key==='Tab'){
    var f=Array.prototype.filter.call($('#sheet').querySelectorAll('button,input,textarea,[tabindex]:not([tabindex="-1"])'),function(n){return !n.disabled&&n.offsetParent!==null;});
    if(!f.length) return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('#sheet'))){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});

document.addEventListener('visibilitychange',function(){if(!document.hidden) render();});
setInterval(function(){if(!document.hidden) render();},60000);

render();
initDb();
initFirebase();
(function(){
  try{
    var q=new URLSearchParams(location.search).get('open');
    if(q){pendingOpen=q;history.replaceState(null,'',location.pathname);}
  }catch(e){}
  if('serviceWorker' in navigator&&location.protocol==='https:'){
    navigator.serviceWorker.register('sw.js').then(refreshPush).catch(function(){});
    navigator.serviceWorker.addEventListener('message',function(e){if(e.data&&e.data.open) handleOpen(e.data.open);});
  }
  setTimeout(runPendingOpen,3500);
})();
})();
</script>
