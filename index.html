ation across plant groups?","opts":["Most seedless vascular plants are heterosporous; all seed plants are homosporous","Most seedless vascular plants are homosporous; all seed plants (and some seedless vascular plants) are heterosporous","All plants, without exception, are homosporous","Only bryophytes show any spore variation at all"],"answer":1,"exp":"Most seedless vascular plants are homosporous (one spore type); heterospory (two spore types) appears in all seed plants and some seedless vascular plants."}]},{"category":"Seeds & Gymnosperms","questions":[{"type":"mc","q":"A seed is best defined as:","opts":["A spore with a thicker wall","An embryo and nutrients surrounded by a protective coat","A gametophyte that never develops further","A type of pollen grain"],"answer":1,"exp":"This is the exact definition given in your notes: embryo + nutrients, wrapped in a protective coat."},{"type":"match","q":"Match each structure in an unfertilized gymnosperm ovule to what it is or contains.","pairs":[["Integument (2n)","Protective layer surrounding the megasporangium"],["Megasporangium (2n)","Contains the megaspore"],["Megaspore (n)","Haploid cell that will develop into the female gametophyte"],["Micropyle","Small opening through which pollen enters"]],"exp":"These four structures make up the unfertilized ovule, before pollination and fertilization occur."},{"type":"match","q":"Match each structure in a fertilized gymnosperm ovule to what it is or does.","pairs":[["Female gametophyte (n)","Develops from the megaspore; contains the egg nucleus"],["Male gametophyte","Develops within a germinated pollen grain (n)"],["Pollen tube","Structure through which the sperm nucleus travels to the egg"],["Discharged sperm nucleus (n)","Fertilizes the egg nucleus"]],"exp":"These structures are present at the moment of fertilization, after the pollen grain has germinated."},{"type":"match","q":"Match each mature gymnosperm seed structure to the structure it developed from.","pairs":[["Seed coat","The integument"],["Food supply","The female gametophyte tissue"],["Embryo (2n)","The fertilized egg"]],"exp":"Tracing each seed structure back to its origin in the ovule shows exactly how 'embryo + nutrients + protective coat' is built."},{"type":"fill","q":"What is the name of the small opening in the integument through which pollen enters the ovule?","accept":["micropyle"],"exp":"The micropyle is the opening pollen passes through to reach the megasporangium."},{"type":"tf","q":"Fertilization in seed plants requires a film of water for sperm to swim through, just as in ferns and mosses.","answer":false,"exp":"False — this is precisely what seeds and pollen solved. Water is no longer required for fertilization, letting seed plants colonize much drier habitats."},{"type":"tf","q":"Seeds are credited with helping shift human societies from hunter-gatherer lifestyles toward permanent settlements and agriculture.","answer":true,"exp":"True — this is explicitly noted as part of the evolutionary significance of seeds in your notes."},{"type":"list","q":"List at least four advantages seeds provided over spores.","model":"Water is not required for fertilization; the integument forms a protective coat giving better resistance in harsh environments; seeds are more resistant than spores generally; seeds can remain dormant for a long time and germinate only when conditions become favourable; and seeds are widely distributed by wind, animals, or water (e.g., coconuts)."},{"type":"mc","q":"Compared to the free-living gametophytes of mosses and ferns, the gametophyte of a seed plant is:","opts":["Larger and fully independent","Drastically reduced, developing within the walls of spores and retained within the tissues of the parent sporophyte","Completely absent","Identical in size and independence"],"answer":1,"exp":"Seed plant gametophytes are tiny, develop inside the spore wall, and stay inside the parent sporophyte rather than living independently."},{"type":"tf","q":"In seed plants, megaspores are dispersed into the environment the same way spores are in ferns and mosses.","answer":false,"exp":"False — megaspores are NOT dispersed into the environment; only pollen (containing the microspore and male gametophyte) is dispersed."},{"type":"fill","q":"What term describes the transfer of pollen to the part of a seed plant containing ovules?","accept":["pollination"],"exp":"Pollination is the transfer step that precedes fertilization in seed plants."},{"type":"list","q":"List the benefits of pollen described in your notes, compared to relying on swimming sperm.","model":"Pollen eliminates the need for a film of water for sperm delivery; pollen can be dispersed great distances by air or animals; and pollen has a protective sporopollenin covering, just like spores."},{"type":"essay","q":"Explain why megaspores and pollen are treated so differently in seed plants — one stays put, the other is dispersed. What does each one carry, and why does this matter?","model":"In seed plants, the megaspore (and the female gametophyte it develops into) is retained inside the parent sporophyte and is never released into the environment — it waits to be fertilized in place. Pollen, by contrast, contains the microspore and the male gametophyte, and is the structure that gets dispersed, by wind or animals, often over long distances. This division of labour means the plant doesn't need to risk its precious egg-containing structure to the environment; instead, only the more disposable, well-protected pollen travels, while fertilization still ultimately happens safely within the parent plant's tissue."},{"type":"match","q":"Match each of the four gymnosperm phyla to a distinguishing fact from your notes.","pairs":[["Phylum Ginkgophyta","Only one living species, Ginkgo biloba, which is deciduous with fan-shaped leaves"],["Phylum Cycadophyta","Cycads"],["Phylum Gnetophyta","Gnetophytes"],["Phylum Coniferophyta","The largest gymnosperm phylum; some species have fleshy seeds that are NOT fruit"]],"exp":"These four phyla together make up all of the gymnosperms (the 'naked seed' plants)."},{"type":"mc","q":"Which gymnosperm phylum contains only a single living species, Ginkgo biloba?","opts":["Cycadophyta","Gnetophyta","Coniferophyta","Ginkgophyta"],"answer":3,"exp":"Ginkgophyta is represented by exactly one extant species: Ginkgo biloba."},{"type":"tf","q":"All conifer seeds are enclosed in a fruit, just like angiosperm seeds.","answer":false,"exp":"False — some conifers have fleshy seed structures, but these are not fruit. True fruit is an angiosperm-specific structure that develops from the ovary."},{"type":"fill","q":"Which gymnosperm phylum is described in your notes as the largest?","accept":["coniferophyta","conifers"],"exp":"Phylum Coniferophyta (conifers) is the largest of the four gymnosperm phyla."}]},{"category":"Angiosperms","questions":[{"type":"mc","q":"All angiosperms belong to a single phylum. What is it called, and what does the name mean?","opts":["Coniferophyta, from the Latin for 'cone'","Anthophyta, from the Greek 'anthos' meaning flower","Bryophyta, from the Greek for 'moss'","Monilophyta, from the Latin for 'fern'"],"answer":1,"exp":"Anthophyta (Greek \"anthos,\" meaning flower) contains every flowering plant species."},{"type":"list","q":"Besides vascular tissue and seeds (already present in gymnosperms), list the two key additional adaptations of angiosperms.","model":"Flowers and fruits."},{"type":"match","q":"Match each flower structure to its description.","pairs":[["Stamen","Male structure made of a filament and an anther that produces pollen"],["Carpel","Female structure made of an ovary, style, and stigma"],["Ovule","Structure inside the ovary that becomes the seed"],["Ovary","Structure that becomes the fruit"]],"exp":"These four terms cover the core reproductive anatomy of a flower."},{"type":"fill","q":"What is the name of the part of the carpel that receives pollen?","accept":["stigma"],"exp":"The stigma, at the top of the style, is where pollen lands and germinates."},{"type":"fill","q":"What is the name of the stalk portion of a stamen, which holds up the anther?","accept":["filament"],"exp":"The filament is the stalk; the anther at its tip is where pollen is produced."},{"type":"tf","q":"Flowers improve reproductive efficiency partly by attracting and rewarding pollen-collecting animals.","answer":true,"exp":"True — this is one of the central advantages flowers gave angiosperms over wind-pollinated gymnosperms."},{"type":"mc","q":"In angiosperms, double fertilization produces which two structures from a single fertilization event?","opts":["Two identical zygotes","A zygote and the endosperm","Two separate seeds","A pollen tube and a stigma"],"answer":1,"exp":"Double fertilization produces both the zygote (which becomes the embryo) and the endosperm (3n, a nutrient supply) simultaneously."},{"type":"fill","q":"What is the ploidy of the endosperm produced during double fertilization?","accept":["3n","triploid"],"exp":"The endosperm is 3n (triploid), and serves as a nutrient source for the embryo."},{"type":"essay","q":"Explain why double fertilization is considered an efficient reproductive strategy, compared to a plant that always builds a large nutrient supply regardless of whether fertilization succeeds.","model":"Because double fertilization produces the nutrient-rich endosperm at the exact same moment as the zygote, the plant only commits resources to building that food supply when an embryo is actually forming. A plant that built its nutrient reserve before or independently of fertilization would waste resources whenever fertilization failed. Double fertilization links the investment directly to reproductive success, making it a more efficient use of the plant's resources."},{"type":"fill","q":"According to your notes, monocots make up more than what fraction of angiosperm species?","accept":["one-quarter","1/4","a quarter"],"exp":"Monocots make up more than one-quarter of all angiosperm species; barley is given as an example."},{"type":"fill","q":"According to your notes, eudicots make up more than what fraction of angiosperm species?","accept":["two-thirds","2/3"],"exp":"Eudicots make up more than two-thirds of all angiosperm species."},{"type":"list","q":"List the six features typically used to compare monocots and eudicots.","model":"Number of cotyledons in the embryo, leaf venation pattern, arrangement of vascular tissue in the stem, type of root system, number of openings in the pollen grain, and the number of floral parts per flower."},{"type":"match","q":"Match each feature to the MONOCOT characteristic (Figure 30.17).","pairs":[["Embryo","One cotyledon"],["Leaf venation","Veins usually parallel"],["Stem vascular tissue","Usually scattered"],["Roots","Usually fibrous (no main root)"],["Pollen grain","One opening"],["Flowers","Floral organs usually in multiples of three"]],"exp":"This is the monocot row of Figure 30.17, Characteristics of monocots and eudicots."},{"type":"match","q":"Match each feature to the EUDICOT characteristic (Figure 30.17).","pairs":[["Embryo","Two cotyledons"],["Leaf venation","Veins usually netlike"],["Stem vascular tissue","Usually arranged in a ring"],["Roots","Taproot (main root) usually present"],["Pollen grain","Three openings"],["Flowers","Floral organs usually in multiples of four or five"]],"exp":"This is the eudicot row of Figure 30.17, Characteristics of monocots and eudicots."},{"type":"mc","q":"A monocot seedling typically has how many cotyledons, and what is its typical leaf venation pattern?","opts":["Two cotyledons; netlike veins","One cotyledon; parallel veins","Two cotyledons; parallel veins","One cotyledon; netlike veins"],"answer":1,"exp":"Monocots have one cotyledon and parallel leaf veins — both are in the name \"mono\" (one)."},{"type":"mc","q":"A eudicot root system is typically described as having a:","opts":["Fibrous root system with no main root","Taproot system, usually with one main root","Completely absent root system","Root system identical to monocots"],"answer":1,"exp":"Eudicots usually have a taproot (a dominant main root), unlike the fibrous, many-branched root system typical of monocots."},{"type":"fill","q":"In a eudicot flower, floral organs are usually arranged in multiples of what number(s)?","accept":["four or five","4 or 5","four and five"],"exp":"Eudicot flower parts usually come in multiples of four or five, compared to multiples of three in monocots."},{"type":"mc","q":"How many openings does a typical eudicot pollen grain have, compared to a monocot's?","opts":["Eudicot: one; Monocot: three","Eudicot: three; Monocot: one","Both have exactly two","Neither has any openings"],"answer":1,"exp":"Eudicot pollen grains typically have three openings, while monocot pollen grains typically have just one."}]},{"category":"Plant Support & Tissues","questions":[{"type":"mc","q":"The plant body is organized into which two main systems?","opts":["Root system and shoot system","Dermal system and vascular system","Xylem system and phloem system","Apical system and lateral system"],"answer":0,"exp":"The root system and the shoot system (stems + leaves) together make up the whole plant body."},{"type":"list","q":"List the three basic plant organs.","model":"Roots, stems, and leaves."},{"type":"list","q":"List the three functions of roots described in your notes.","model":"Anchoring the plant, absorbing water and minerals, and storing organic nutrients such as carbohydrates."},{"type":"fill","q":"What is described as the main photosynthetic organ of the plant?","accept":["leaves","leaf"],"exp":"Leaves are the main site of photosynthesis; stems exist largely to support the leaves."},{"type":"match","q":"Match each plant tissue system to its general role.","pairs":[["Dermal tissue","Outer protective covering of the plant"],["Vascular tissue","Transport of water, minerals, and sugars"],["Ground tissue","Fills the space between dermal and vascular tissue; photosynthesis, storage, and support"]],"exp":"These three tissue systems run throughout the whole plant body, in both roots and shoots."},{"type":"tf","q":"Sclerenchyma and the water-conducting cells of the xylem are both typically dead at maturity.","answer":true,"exp":"True — both cell types provide structural support and function best once dead, after laying down rigid cell walls."},{"type":"mc","q":"Which plant tissue conducts water, and is dead at maturity?","opts":["Phloem","Xylem","Parenchyma","Collenchyma"],"answer":1,"exp":"Xylem conducts water and is dead at maturity, which actually helps water move efficiently through its hollow, non-living cells."},{"type":"tf","q":"Cambium is found in the stems of all plants equally, both monocots and eudicots.","answer":false,"exp":"False — your notes specify cambium is found only in eudicot stems."},{"type":"list","q":"List the plant cell/tissue types from LEAST to MOST support, noting which are dead at maturity.","model":"Least support (living at maturity): parenchyma, then collenchyma (cambium and phloem are also living). Most support (dead at maturity): sclerenchyma, then xylem."},{"type":"fill","q":"What term describes regions of actively dividing plant cells, found at root and shoot tips (and axillary buds), responsible for primary growth?","accept":["apical meristems","apical meristem"],"exp":"Apical meristems drive primary growth — the lengthwise elongation of roots and shoots."},{"type":"fill","q":"What term describes a plant's ability to keep growing throughout its entire life?","accept":["indeterminate growth"],"exp":"Indeterminate growth means plants, unlike most animals, never truly stop growing."},{"type":"list","q":"List the three zones of primary growth in a root, in order from the root tip.","model":"Zone of cell division, zone of elongation, and zone of differentiation (maturation)."},{"type":"mc","q":"Secondary growth (increase in thickness) in woody plants is driven by:","opts":["Apical meristems only","Lateral meristems: vascular cambium and cork cambium","Ground tissue alone","Sporangia"],"answer":1,"exp":"Lateral meristems — vascular cambium (adds wood and secondary phloem) and cork cambium (produces periderm) — are responsible for secondary growth."},{"type":"match","q":"Match each lateral meristem to what it produces.","pairs":[["Vascular cambium","Secondary xylem (wood) and secondary phloem"],["Cork cambium","Periderm, which replaces the epidermis and is thicker and tougher"]],"exp":"These are the two lateral meristems responsible for secondary growth in woody plants."},{"type":"mc","q":"In a eudicot root, the xylem is typically arranged:","opts":["In a star shape, with phloem between the arms","As a central core surrounded by rings of tissue","Scattered randomly throughout the root","Absent entirely"],"answer":0,"exp":"Eudicot roots have a star-shaped xylem core, with phloem sitting in the gaps between the points of the star — a different arrangement from monocot roots."},{"type":"mc","q":"In many monocot roots, the tissue arrangement is best described as:","opts":["A star-shaped xylem core with phloem between the arms","A core of parenchyma cells surrounded by rings of xylem, then phloem","No vascular tissue present at all","Identical to the eudicot arrangement"],"answer":1,"exp":"Monocot roots have a central core of parenchyma surrounded by a ring of xylem and then a ring of phloem — distinct from the eudicot star pattern."}]}]},{"week":4,"weekLabel":"Week 4","groups":[{"category":"Animal Characteristics & Body Plans","questions":[{"type":"list","q":"List the four characteristics of animals given in your notes.","model":"Eukaryotic; multicellular; ingestive chemoheterotrophs; and composed of tissues that develop from embryonic germ layers."},{"type":"mc","q":"Which of the following is TRUE of animal cells, compared to plant and fungal cells?","opts":["Animal cells have rigid cellulose cell walls","Animal cells lack cell walls, and bodies are held together by structural proteins like collagen","Animal cells always have a cell wall made of chitin","Animal cells lack any structural support proteins"],"answer":1,"exp":"Animal cells lack cell walls; instead, structural proteins such as collagen hold animal bodies together."},{"type":"tf","q":"Nervous tissue and muscle tissue are unique to animals among all the kingdoms.","answer":true,"exp":"True — these two tissue types are not found in plants, fungi, or protists."},{"type":"fill","q":"What is the term for the outer germ layer covering an embryo's surface?","accept":["ectoderm"],"exp":"Ectoderm is the outermost germ layer."},{"type":"fill","q":"What is the term for the innermost germ layer, which lines the developing digestive tube?","accept":["endoderm"],"exp":"Endoderm lines the digestive tube that develops in the embryo."},{"type":"mc","q":"Diploblastic animals, such as cnidarians, have which germ layers?","opts":["Ectoderm and endoderm only","Ectoderm, mesoderm, and endoderm","Mesoderm only","None — they lack germ layers entirely"],"answer":0,"exp":"Diploblastic animals have only ectoderm and endoderm, unlike triploblastic animals, which also have mesoderm."},{"type":"tf","q":"All bilaterians are triploblastic, meaning they have an additional mesoderm layer between the ectoderm and endoderm.","answer":true,"exp":"True — triploblastic development (with mesoderm) is a defining feature of all bilaterally symmetrical animals."},{"type":"mc","q":"A larva is best described as:","opts":["A sexually mature adult form","A sexually immature stage, morphologically distinct from the adult, that later undergoes metamorphosis","A type of germ layer","A synonym for a gamete"],"answer":1,"exp":"Larvae are sexually immature, often live in a different environment than the adult, and undergo metamorphosis."},{"type":"fill","q":"What class of genes determines the development of animal body forms?","accept":["hox genes","hox"],"exp":"Hox genes control the body plan layout during development."},{"type":"mc","q":"According to your notes, approximately when did the common ancestor of all living animals likely live?","opts":["700–770 million years ago","7,000–7,700 years ago","70–77 million years ago","7–7.7 billion years ago"],"answer":0,"exp":"Molecular and morphological data suggest a common ancestor roughly 700 to 770 million years ago."},{"type":"fill","q":"The common ancestor of animals is thought to have resembled which modern protist group, the closest living relatives of animals?","accept":["choanoflagellates","choanoflagellate"],"exp":"Choanoflagellates are considered the closest living protist relatives of animals."},{"type":"list","q":"List the three lines of evidence given for choanoflagellates being closely related to animals.","model":"Remarkable similarity in cell morphology between choanoflagellates and sponges (collar cells); collar cells are not found in plants, fungi, or non-choanoflagellate protists; and DNA sequence homology shows choanoflagellates and animals are sister taxa."},{"type":"fill","q":"What term describes 'a particular set of morphological and developmental traits integrated into a functional living animal'?","accept":["body plan"],"exp":"This is the exact definition of a body plan given in your notes."},{"type":"mc","q":"Which phylum is distinguished from all other animals by lacking true tissues?","opts":["Cnidaria","Platyhelminthes","Porifera","Mollusca"],"answer":2,"exp":"Porifera (sponges) lack true tissues; all other animals are eumetazoans, which do have true tissues."},{"type":"mc","q":"Animals with radial symmetry are best described as having:","opts":["A clear front, back, left, and right","No front/back or left/right distinction","A head and a tail only, with no other symmetry","A completely asymmetric, irregular body"],"answer":1,"exp":"Radially symmetrical animals (like cnidarians) have no front/back or left/right sides — symmetry around a central axis."},{"type":"list","q":"List the five features that bilaterally symmetrical animals have, according to your notes.","model":"A dorsal (top) and ventral (bottom) side; a right and left side; anterior (head) and posterior (tail) ends; the triploblastic condition in gastrulation; and cephalization (development of a head)."},{"type":"fill","q":"What term describes the evolutionary development of a head, with sensory organs concentrated at the front of the body?","accept":["cephalization"],"exp":"Cephalization is linked to the head end being the first to encounter food, danger, and the environment."},{"type":"list","q":"List at least three significances/consequences of the evolution of bilateral symmetry described in your notes.","model":"It resulted in cephalization; the head end became the first to encounter food and danger and interact with the environment; it allowed evolution of specialized sensory organs on the head; bilaterally symmetrical organisms became more active; and the head enabled additional adaptations like burrowing and swimming."},{"type":"match","q":"Match each body cavity type to its description.","pairs":[["Coelomate","Possesses a true coelom, a body cavity fully derived from mesoderm"],["Pseudocoelomate","Possesses a pseudocoelom (hemocoel), a body cavity derived from mesoderm AND endoderm"],["Acoelomate","Lacks a body cavity entirely — a compact body"]],"exp":"These three categories describe how triploblastic bilaterian bodies are organized around (or without) a fluid-filled cavity."},{"type":"mc","q":"Which phylum is given as the example of an acoelomate body plan?","opts":["Annelida","Nematoda","Platyhelminthes","Mollusca"],"answer":2,"exp":"Platyhelminthes (flatworms) are the acoelomate example — triploblastic animals lacking any body cavity."},{"type":"match","q":"Match each body-cavity example phylum to its correct body-cavity category.","pairs":[["Annelida (earthworm)","Coelomate"],["Nematoda (roundworm) and Rotifera","Pseudocoelomate"],["Platyhelminthes (flatworm)","Acoelomate"]],"exp":"These are the specific example phyla your notes use to illustrate each body-cavity category."},{"type":"list","q":"List at least two functions of the coelom described in your notes.","model":"Cushioning of suspended organs prevents internal injury; coelomic fluid provides a form of skeletal support; and internal organs can grow and move somewhat independently of the outer body wall."},{"type":"mc","q":"In protostome development, what does the blastopore develop into?","opts":["The anus","The mouth","Both the mouth and anus simultaneously","Neither — it disappears entirely"],"answer":1,"exp":"In protostomes (e.g., molluscs, annelids), the mouth develops from the blastopore."},{"type":"mc","q":"In deuterostome development, what does the blastopore develop into?","opts":["The mouth","The anus","The notochord","The coelom"],"answer":1,"exp":"In deuterostomes (e.g., echinoderms, chordates), the anus develops from the blastopore."},{"type":"match","q":"Match each developmental group to its example phyla.","pairs":[["Protostome development","Molluscs, annelids"],["Deuterostome development","Echinoderms, chordates"]],"exp":"The fate of the blastopore is the key distinguishing feature between these two developmental patterns."}]},{"category":"Porifera, Cnidaria & Platyhelminthes","questions":[{"type":"mc","q":"According to the Key Concept for sponges, Porifera are best described as:","opts":["Advanced animals with complex tissues","Basal animals that lack true tissues","Deuterostomes with a notochord","Coelomates with segmented bodies"],"answer":1,"exp":"Concept 33.1: Sponges are basal animals that lack true tissues."},{"type":"fill","q":"What are the flagellated, collar-shaped cells in sponges called, which ingest bacteria and tiny food particles?","accept":["choanocytes","choanocyte"],"exp":"Choanocytes (collar cells) are a defining feature of Porifera."},{"type":"match","q":"Match each labeled sponge structure (Figure 33.4) to its role.","pairs":[["Osculum","Large opening where water exits the sponge"],["Spongocoel","Central cavity through which water flows"],["Pores","Openings through which water enters the body wall"],["Spicules","Skeletal structural elements within the body"],["Amoebocytes","Mobile cells that carry out phagocytosis of food particles and distribute nutrients"],["Mesohyl","Gelatinous region between the outer and inner cell layers"]],"exp":"These are the key labeled structures from Figure 33.4, Anatomy of a sponge."},{"type":"list","q":"List the general characteristics of sponges described in Figure 33.4 (body plan, mobility, cell organization, nervous system).","model":"Asymmetric body plan; the most primitive of all animals, with a simple structure; an aggregation of cells with very little differentiation or specialization; sessile (permanently attached, not free to move about); and they do not form nerve tissue."},{"type":"mc","q":"According to the Key Concept for cnidarians, Cnidaria are best described as:","opts":["The most recently evolved animal phylum","An ancient phylum of eumetazoans","A phylum that lacks true tissues","Deuterostomes closely related to echinoderms"],"answer":1,"exp":"Concept 33.2: Cnidarians are an ancient phylum of eumetazoans."},{"type":"list","q":"List the key features of Cnidaria described in the master summary table (Fig. 33-UN6).","model":"Unique stinging structures (cnidae), each housed in a specialized cell called a cnidocyte; diploblastic; radially symmetrical; and a gastrovascular cavity — a digestive compartment with a single opening."},{"type":"match","q":"Match each cnidarian class to its description.","pairs":[["Hydrozoa","Some species, such as hydroids, live as colonial polyps"],["Scyphozoa","'True jellies'; many are bioluminescent; food is transferred via nematocyst-bearing tentacles to oral arms"],["Cubozoa","Box jellies; includes the notorious sea wasp, Chironex fleckeri, with venom more potent than cobra venom"],["Anthozoa","Sea anemones and other anthozoans exist only as polyps; many form symbiotic relationships with photosynthetic algae"]],"exp":"These are the four cnidarian classes shown in Figure 33.7, Cnidarians."},{"type":"fill","q":"Which cnidarian class includes the sea wasp (Chironex fleckeri), whose venom is more potent than cobra venom?","accept":["cubozoa"],"exp":"Cubozoa (box jellies) includes this notoriously venomous species."},{"type":"tf","q":"Anthozoans, such as sea anemones, exist both as polyps and as free-swimming medusae during their life cycle.","answer":false,"exp":"False — anthozoans exist only as polyps; they never have a medusa stage."},{"type":"mc","q":"A gastrovascular cavity, found in cnidarians, is best described as:","opts":["A digestive compartment with two separate openings (mouth and anus)","A digestive compartment with a single opening","A fluid-filled body cavity unrelated to digestion","A structure unique to sponges"],"answer":1,"exp":"Cnidarians have a gastrovascular cavity with just one opening, used for both ingestion and egestion."},{"type":"mc","q":"Platyhelminthes (flatworms) are best described, according to the master summary table, as:","opts":["Coelomates with segmented bodies","Dorsoventrally flattened, unsegmented acoelomates with a gastrovascular cavity or no digestive tract","Pseudocoelomates with jaws in the pharynx","Radially symmetrical diploblastic animals"],"answer":1,"exp":"Flatworms are acoelomates: dorsoventrally flattened and unsegmented, with either a gastrovascular cavity or no digestive tract at all."},{"type":"tf","q":"Planarians (a type of flatworm) have light-sensitive eyespots and a centralized nerve net.","answer":true,"exp":"True — planarians show relatively advanced sensory and nervous features for an acoelomate."},{"type":"fill","q":"In tapeworms, what is the name of the structure containing suckers and hooks used for attaching to the host?","accept":["scolex"],"exp":"The scolex is the tapeworm's attachment structure, found at its anterior end."}]},{"category":"Lophotrochozoans: Mollusca, Annelida, Nematoda & More","questions":[{"type":"fill","q":"What is the name of the clade, identified by molecular data, that has the widest range of animal body forms, including flatworms, molluscs, and annelids?","accept":["lophotrochozoa","lophotrochozoans"],"exp":"Concept 33.3: Lophotrochozoans have the widest range of animal body forms of any clade."},{"type":"mc","q":"Rotifera (rotifers) are best described as:","opts":["Acoelomates with no digestive tract","Pseudocoelomates with an alimentary canal, jaws (trophi) in the pharynx, and a ciliated crown on the head","Coelomates with a lophophore","Coelomates with jointed appendages"],"answer":1,"exp":"Rotifers are pseudocoelomates with a complete alimentary canal (mouth and anus), jaws called trophi, and a ciliated head crown."},{"type":"fill","q":"What term describes the jaw structures found in the pharynx of rotifers?","accept":["trophi"],"exp":"Trophi are the jaw-like structures rotifers use for feeding."},{"type":"mc","q":"Lophophorates (Ectoprocta, Brachiopoda) are defined by having:","opts":["A muscular foot and visceral mass","Lophophores — feeding structures bearing ciliated tentacles","A segmented body wall","Jointed appendages and an exoskeleton"],"answer":1,"exp":"Lophophorates are coelomates defined by the lophophore, a feeding structure with ciliated tentacles."},{"type":"list","q":"List the three main body parts of a mollusc, according to the master summary table.","model":"A muscular foot, a visceral mass, and a mantle."},{"type":"mc","q":"Most molluscs have a hard shell made of what material?","opts":["Chitin","Calcium carbonate","Keratin","Cellulose"],"answer":1,"exp":"Most molluscs secrete a hard shell made of calcium carbonate, though the coelom itself is reduced in this phylum."},{"type":"tf","q":"In molluscs, the coelom is large and prominent, forming the majority of the body cavity.","answer":false,"exp":"False — in molluscs, the coelom is actually reduced; most of the body is organized around the foot, visceral mass, and mantle instead."},{"type":"mc","q":"Annelida (segmented worms) are coelomates distinguished by:","opts":["A segmented body wall and internal organs, with the digestive tract also segmented","A segmented body wall and internal organs, EXCEPT the digestive tract, which is unsegmented","A complete lack of segmentation","A shell made of calcium carbonate"],"answer":1,"exp":"Annelids are segmented throughout the body wall and most internal organs — but notably, the digestive tract itself remains unsegmented."},{"type":"fill","q":"What is the name of the clade, identified as the most species-rich animal group, that includes Nematoda and Arthropoda?","accept":["ecdysozoa","ecdysozoans"],"exp":"Concept 33.4: Ecdysozoans are the most species-rich animal group."},{"type":"mc","q":"Nematodes (roundworms) are best described as:","opts":["Segmented coelomates with jointed appendages","Cylindrical, unsegmented pseudocoelomates with tapered ends, no circulatory system, that undergo ecdysis","Dorsoventrally flattened acoelomates","Coelomates with a lophophore"],"answer":1,"exp":"Nematodes are cylindrical, unsegmented pseudocoelomates that molt (ecdysis) and have no circulatory system."},{"type":"fill","q":"What term describes the shedding/molting process that ecdysozoans (such as nematodes and arthropods) undergo?","accept":["ecdysis"],"exp":"Ecdysis is the process of shedding the old cuticle/exoskeleton, which gives the clade Ecdysozoa its name."}]},{"category":"Arthropoda, Echinodermata & Chordate Origins","questions":[{"type":"list","q":"List the defining features of Arthropoda given in the master summary table.","model":"Coelomates with a segmented body, jointed appendages, and an exoskeleton made of protein and chitin."},{"type":"match","q":"Match each labeled region/structure on the crustacean body diagram to its role.","pairs":[["Cephalothorax","Fused head and thorax region"],["Antennae","Sensory reception"],["Swimming appendages","One pair per abdominal segment"],["Pincer","Defense"],["Mouthparts","Feeding"],["Walking legs","Locomotion"]],"exp":"These are the labeled structures on the crustacean (lobster-type) body plan diagram in your notes."},{"type":"tf","q":"The arthropod exoskeleton is made of protein and chitin.","answer":true,"exp":"True — this combination gives arthropods a rigid, protective, lightweight exoskeleton."},{"type":"list","q":"List the defining features of Echinodermata given in the master summary table.","model":"Coelomates with bilaterally symmetrical larvae and five-part body organization as adults; a unique water vascular system; and an endoskeleton."},{"type":"fill","q":"What term describes the five-part radial body symmetry seen in adult echinoderms, such as sea stars?","accept":["pentaradial symmetry","pentaradial"],"exp":"Pentaradial symmetry describes the five-part body plan of adult echinoderms."},{"type":"tf","q":"Echinoderm larvae are bilaterally symmetrical, even though the adults display radial (pentaradial) symmetry.","answer":true,"exp":"True — this mismatch between larval and adult symmetry is a notable feature of echinoderm development."},{"type":"mc","q":"Echinoderms and chordates are grouped together because they are both:","opts":["Protostomes","Deuterostomes","Acoelomates","Diploblastic"],"answer":1,"exp":"Concept 33.5: Echinoderms and chordates are deuterostomes, sharing the anus-from-blastopore developmental pattern."},{"type":"list","q":"List the four defining derived characters of Chordata given in your notes.","model":"A notochord (gelatinous material providing support, between the position of vertebrae); a nerve cord (the central nervous system — brain and spinal cord); pharyngeal slits (used in feeding, gas exchange, jaw support, and hearing); and a muscular post-anal tail (extending posterior to the anus)."},{"type":"match","q":"Match each chordate feature, as labeled in the body-plan diagram, to its description.","pairs":[["Notochord","Flexible rod providing support"],["Dorsal, hollow nerve cord","Runs along the back of the body"],["Pharyngeal slits or clefts","Openings in the pharynx region"],["Post-anal tail","Tail extending beyond the anus"],["Muscle segments","Segmented muscle blocks along the body"]],"exp":"These are the five labeled features in the generalized chordate body-plan diagram (Fig. 33-UN6e)."},{"type":"list","q":"List the three subphyla of Chordata named in your notes, with their common names.","model":"Urochordata (tunicates), Cephalochordata (lancelets), and Vertebrata."}]},{"category":"Fishes & Amphibians","questions":[{"type":"list","q":"List, in order, the vertebrate lineages shown in the phylogeny diagram (Figure 34.Un 01), from most basal to most derived.","model":"Hagfishes, then Lampreys, then Sharks/stingrays (Chondrichthyes), then Ray-finned fishes (Actinopterygii), then Coelacanths (Actinistia), then Lungfishes, leading into the tetrapod vertebrates."},{"type":"list","q":"List the three features of hagfishes (Myxini) given in your notes.","model":"A cartilaginous skull; reduced vertebrae; and a flexible rod of cartilage derived from the notochord."},{"type":"tf","q":"Hagfishes are jawed vertebrates that are primarily freshwater filter feeders.","answer":false,"exp":"False — hagfishes are jawless vertebrates, and are marine, mostly bottom-dwelling scavengers."},{"type":"mc","q":"How do hagfishes defend themselves and potentially suffocate attacking fish?","opts":["By releasing a toxin from their skin","By secreting slime that coats the gills of attacking fish","By biting with sharp jaws","By camouflaging with colour-changing skin"],"answer":1,"exp":"Hagfish slime coats the gills of an attacking fish, which can cause it to suffocate."},{"type":"mc","q":"Lampreys (Pteromyzontida) are best described as:","opts":["Jawed vertebrates with bony skeletons","Jawless vertebrates with cartilaginous segments surrounding the notochord, arching partly over the nerve cord","Tetrapods with four limbs","Cartilaginous fish with true jaws"],"answer":1,"exp":"Like hagfishes, lampreys are jawless, but have cartilaginous segments around the notochord that arch partly over the nerve cord — an early step toward vertebrae."},{"type":"fill","q":"What term describes vertebrates that have jaws (such as Chondrichthyes and all vertebrates beyond it)?","accept":["gnathostomes","gnathostome"],"exp":"Gnathostomes are jawed vertebrates; Chondrichthyes represents the earliest gnathostome lineage."},{"type":"mc","q":"Chondrichthyes (sharks, stingrays, ratfish) have a skeleton predominantly composed of:","opts":["Bone, with cartilage only in the fins","Cartilage, although bone is present in their scales and teeth","Pure chitin","Calcium carbonate"],"answer":1,"exp":"Chondrichthyans have mostly cartilaginous skeletons, but do have bone in their scales and teeth."},{"type":"tf","q":"Sharks control buoyancy using a gas-filled swim bladder, just like bony fish.","answer":false,"exp":"False — sharks have no swim bladder; they control buoyancy by storing oil in the liver, and will sink if they stop swimming."},{"type":"tf","q":"Although most Chondrichthyans are carnivores, the largest consume plankton.","answer":true,"exp":"True — this is a notable exception; the largest cartilaginous fish are filter feeders on plankton, not large-prey hunters."},{"type":"mc","q":"Osteichthyes (bony fish and tetrapods) are distinguished by having a skeleton made of:","opts":["Cartilage with a matrix of calcium carbonate","A bony skeleton with a hard matrix of calcium phosphate","Chitin and protein","Collagen only, with no mineral component"],"answer":1,"exp":"Osteichthyan bone has a hard calcium phosphate matrix, distinguishing it from the cartilage of Chondrichthyes."},{"type":"tf","q":"The term 'Osteichthyes' includes only aquatic bony fish, and excludes tetrapods.","answer":false,"exp":"False — Osteichthyans include both bony fish AND tetrapods. Aquatic osteichthyans are what we informally call 'fishes.'"},{"type":"mc","q":"Actinopterygii (ray-finned bony fishes) have fins that are supported mainly by:","opts":["Muscular lobes","Long, flexible rays","Cartilage plates","Bone-free webbing only"],"answer":1,"exp":"Ray-finned fish fins are supported by long, flexible rays, modified for maneuvering, defense, and other functions."},{"type":"mc","q":"Actinistia (coelacanths) are notable lobe-finned fish because:","opts":["They are the ancestors of modern sharks","They are considered ancestors of tetrapods, and have muscular pelvic and pectoral fins","They have no fins at all","They evolved directly from amphibians"],"answer":1,"exp":"Coelacanths (Actinistia) are lobe-finned fish with muscular paired fins, considered ancestral to the tetrapod lineage."},{"type":"tf","q":"Coelacanths were thought to have gone extinct 75 million years ago, until a living specimen was caught off the coast of South Africa in 1938.","answer":true,"exp":"True — this is one of the most famous 'living fossil' discoveries in biology."},{"type":"list","q":"List the five derived characters/adaptations of tetrapods described in your notes.","model":"Four limbs and feet with digits; a neck, allowing separate movement of the head; fusion of the pelvic girdle to the backbone; the absence of gills (except in some aquatic species); and ears for detecting airborne sounds."},{"type":"fill","q":"The word 'amphibian' means 'both ways of life' — what does this refer to specifically?","accept":["metamorphosis of an aquatic larva into a terrestrial adult","the metamorphosis from an aquatic larva to a terrestrial adult"],"exp":"It refers to the metamorphosis of an aquatic larva (such as a tadpole) into a terrestrial adult."},{"type":"list","q":"List the six distinguishing characteristics of amphibians given in your notes.","model":"Smooth skin, with gas exchange occurring through the moist skin; presence of gills or lungs; four appendages; a three-chambered heart; cold-bloodedness (ectothermy); and external fertilization in most species, with eggs requiring a moist environment."},{"type":"mc","q":"How many chambers does an amphibian heart typically have?","opts":["Two","Three","Four","Five"],"answer":1,"exp":"Amphibians have a three-chambered heart, compared to the four-chambered hearts of birds and mammals."}]},{"category":"Reptiles, Birds & Mammals","questions":[{"type":"mc","q":"Amniotes (reptiles, birds, and mammals) are defined as tetrapods with:","opts":["A three-chambered heart","A terrestrially adapted egg","Smooth, moist skin","No skeleton"],"answer":1,"exp":"The amniotic egg — a key adaptation to life on land — defines the amniote clade."},{"type":"list","q":"List at least three membranes/structures of the amniotic egg shown in Figure 34-25.","model":"The amnion (surrounds the amniotic cavity and fluid around the embryo), the chorion, the allantois, the yolk sac (containing the yolk, a nutrient source), the albumen, and the shell."},{"type":"list","q":"List the terrestrial adaptations of amniotes described in your notes, beyond the amniotic egg itself.","model":"Relatively impermeable skin, and the ability to use the rib cage to ventilate the lungs."},{"type":"list","q":"List the four distinguishing characteristics of reptiles given in your notes.","model":"Scaly skin containing a waterproof barrier (the protein keratin), meaning they must rely exclusively on lungs for gas exchange; a three-chambered heart; laying shelled eggs; and being cold-blooded (ectothermic) — with the exception of birds."},{"type":"fill","q":"What protein gives reptile skin its waterproof barrier?","accept":["keratin"],"exp":"Keratin makes reptile skin waterproof, forcing reliance on lungs alone for gas exchange."},{"type":"tf","q":"Because reptile skin is waterproof, reptiles must rely exclusively on their lungs for gas exchange (unlike amphibians, which can also use their skin).","answer":true,"exp":"True — this is a direct consequence of the waterproof, keratinized reptile skin."},{"type":"list","q":"List the four distinguishing characteristics of birds given in your notes.","model":"Feathered; warm-blooded (endothermic); a four-chambered heart; and four limbs, with the first pair modified into wings."},{"type":"tf","q":"Birds are classified among the reptiles in your notes' phylogeny, and are the one major exception to reptiles generally being ectothermic.","answer":true,"exp":"True — birds are endothermic ('warm-blooded'), unlike most other reptiles, which are ectothermic."},{"type":"match","q":"Match each vertebrate group to its heart structure.","pairs":[["Amphibians","Three-chambered heart"],["Reptiles (non-bird)","Three-chambered heart"],["Birds","Four-chambered heart"],["Mammals","Hair and milk production"]],"exp":"Heart-chamber number is a useful, concrete way to compare these vertebrate groups' circulatory efficiency."},{"type":"list","q":"List the five derived characters of mammals given in your notes.","model":"Mammary glands, which produce milk; hair; a high metabolic rate, due to endothermy; a larger brain than other vertebrates of equivalent size; and differentiated teeth."},{"type":"list","q":"List the three lineages of mammals named in your notes.","model":"Monotremes, marsupials, and eutherians."},{"type":"mc","q":"Monotremes, such as the echidna and platypus, are unusual among mammals because they:","opts":["Lack mammary glands entirely","Lay eggs, rather than giving birth to live young","Are cold-blooded","Lack hair"],"answer":1,"exp":"Monotremes are the only mammals that lay eggs, though they still suckle their young afterward."},{"type":"tf","q":"Monotremes have nipples, just like other mammals, through which their offspring suckle milk.","answer":false,"exp":"False — monotremes lack nipples; their offspring suck milk directly from the mother's fur."},{"type":"fill","q":"What is the name of the pouch in which marsupials complete much of their embryonic development while nursing?","accept":["marsupium"],"exp":"The marsupium is the maternal pouch where marsupial young continue developing after birth."},{"type":"mc","q":"Eutherian mammals (placental mammals) are distinguished from marsupials by having:","opts":["No placenta at all","A simpler placenta than marsupials","A more complex placenta than marsupials","The ability to lay eggs"],"answer":2,"exp":"Eutherians have placentas that are more complex than those of marsupials, supporting longer internal development."},{"type":"list","q":"Using the nested 'Key Concepts' summary from the end of the vertebrate unit, define each level by what it adds to the one before it: Chordates, Vertebrates, Gnathostomes, Tetrapods, Amniotes, Mammals.","model":"Chordates have a notochord and a dorsal, hollow nerve cord. Vertebrates are chordates that have a backbone. Gnathostomes are vertebrates that have jaws. Tetrapods are gnathostomes that have limbs. Amniotes are tetrapods that have a terrestrially adapted egg. Mammals are amniotes that have hair and produce milk."},{"type":"match","q":"Match each vertebrate clade to the single defining feature it adds, according to the nested Key Concepts summary.","pairs":[["Vertebrates","Have a backbone"],["Gnathostomes","Have jaws"],["Tetrapods","Have limbs"],["Amniotes","Have a terrestrially adapted egg"],["Mammals","Have hair and produce milk"]],"exp":"Each clade in this nested hierarchy is defined by one additional derived trait layered on top of the previous group."},{"type":"essay","q":"Using the nested clade structure (Chordates → Vertebrates → Gnathostomes → Tetrapods → Amniotes → Mammals), explain why a mammal is technically also a gnathostome and a chordate.","model":"Each clade in this hierarchy is nested inside the one before it, defined by adding one new derived trait while keeping all the traits of the groups before it. A mammal is an amniote (has a terrestrially adapted egg or its equivalent), which is a tetrapod (has limbs), which is a gnathostome (has jaws), which is a vertebrate (has a backbone), which is a chordate (has a notochord and dorsal hollow nerve cord). Because each group is defined as a more specific version of the one before it, every mammal automatically carries all of the ancestral traits too — including having jaws (gnathostome) and being a chordate — even though those aren't the traits that make it specifically a 'mammal.'"}]}]}];

const zn=s=>String(s).toLowerCase().replace(/<[^>]+>/g,"").replace(/[^a-z0-9]+/g," ").trim();
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
function ask(){
  cur=nextQ();const q=cur,c=$("qcard");c.classList.remove("hide");
  c.innerHTML=`<div class="mut">${esc(q.w)} · ${esc(q.g)} · Reel ${g.prog}/${g.need} · ${"❤️".repeat(3-g.strikes)}${"🖤".repeat(g.strikes)}</div><p class="qt">${q.q}</p><div id="ans"></div><div id="fb"></div>`;
  const a=$("ans");
  if(q.type==="mc")a.innerHTML=shuffle(q.opts.map((o,i)=>i)).map((i,n)=>`<button class="opt" data-i="${i}" onclick="pick(${i},this)">${n+1}. ${q.opts[i]}</button>`).join("");
  else if(q.type==="tf")a.innerHTML=`<button class="opt" data-i="1" onclick="pick(true,this)">1. True</button><button class="opt" data-i="0" onclick="pick(false,this)">2. False</button>`;
  else if(q.type==="fill")a.innerHTML=`<input type="text" id="fi" autocomplete="off" autocapitalize="off" placeholder="Type your answer, press Enter"><button style="margin-top:8px;width:100%" onclick="chkFill()">Submit</button>`;
  else if(q.type==="match"){q.rs=shuffle(q.pairs.map(p=>p[1]));a.innerHTML=q.pairs.map((p,i)=>`<div class="mrow"><span>${p[0]}</span><select id="m${i}"><option value="">Choose…</option>${q.rs.map(r=>`<option>${esc(r)}</option>`).join("")}</select></div>`).join("")+`<button style="width:100%" onclick="chkMatch()">Submit</button>`}
  else a.innerHTML=`<textarea id="ta" rows="3" placeholder="Write your answer (optional), then press Enter"></textarea><button style="margin-top:8px;width:100%" onclick="reveal()">Reveal model answer</button>`;;const fe=$("fi")||$("ta");if(fe)setTimeout(()=>fe.focus({preventScroll:true}),30);c.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function pick(v,btn){
  const q=cur,ok=q.type==="tf"?v===q.answer:v===q.answer;
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const i=b.dataset.i;if(q.type==="tf"?(i==="1")===q.answer:+i===q.answer)b.classList.add("ok")});
  if(!ok)btn.classList.add("bad");finish(ok,q.exp);
}
function chkFill(){
  const v=zn($("fi").value),q=cur;if(!v)return;
  const ok=q.accept.some(a=>{a=zn(a);return a===v||(a.length>4&&lev(a,v)<=1)});
  $("fi").disabled=true;finish(ok,"Accepted: <b>"+esc(q.accept.join(" / "))+"</b><br>"+(q.exp||""),!ok);
}
function chkMatch(){
  const q=cur;let all=true;
  q.pairs.forEach((p,i)=>{const s=$("m"+i);s.disabled=true;const ok=s.value===p[1];if(!ok){all=false;s.style.borderColor="var(--bad)"}else s.style.borderColor="var(--ok)"});
  finish(all,(all?"":"<b>Correct pairs:</b><br>"+q.pairs.map(p=>p[0]+" → "+esc(p[1])).join("<br>")+"<br>")+(q.exp||""));
}
function reveal(){
  $("ans").innerHTML=`<div class="mut">Model answer:</div><p style="margin:4px 0 10px;-webkit-user-select:text">${esc(cur.model)}</p><div class="row" id="sg"><button onclick="self(1)">✅ I got it</button><button class="sec" onclick="self(0)">❌ Missed it</button></div>`;
}
function self(ok){score(ok);cont(ok)}
function score(ok){S.total++;if(ok){S.right++;streak++}else streak=0;hud()}
function finish(ok,txt,override){
  score(ok);const fb=$("fb");
  fb.innerHTML=(ok?"✅ <b>Correct!</b> ":"❌ <b>Not quite.</b> ")+(txt||"")+`<div class="row" style="margin-top:10px">`+(override?`<button class="sec" onclick="S.right++;S.total--;score(1);cont(1)">I was right</button>`:"")+`<button id="cb" onclick="cont(${ok})">Continue (Enter)</button></div>`;
  ok?sfxReel():beep(200,.15)
}
function cont(ok){
  if(g.st!=="fight")return;
  if(ok){g.prog++;if(g.prog>=g.need)return landFish()}else{g.strikes++;if(g.strikes>=3)return lose("The line snapped! 💔")}
  ask();
}
