    href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Figtree:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #F1F5F6;
      --sf: #fff;
      --ink: #12302F;
      --mute: #5E7574;
      --line: #D5E0E1;
      --ac: #0F5F5C;
      --acink: #fff;
      --hero: #0F3D3E;
      --heroink: #F4FBFA;
      --hi: #F2C14E;
      --ok: #2E8B57;
      --bad: #C8402E;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0C1A1B;
        --sf: #14292A;
        --ink: #E6F3F2;
        --mute: #92B0AE;
        --line: #264546;
        --ac: #5FD3C4;
        --acink: #062423;
        --hero: #0F3D3E;
        --ok: #5CC98A;
        --bad: #F2806F
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0C1A1B;
      --sf: #14292A;
      --ink: #E6F3F2;
      --mute: #92B0AE;
      --line: #264546;
      --ac: #5FD3C4;
      --acink: #062423;
      --hero: #0F3D3E;
      --ok: #5CC98A;
      --bad: #F2806F
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 400 16px/1.5 Figtree, system-ui, sans-serif
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 16px 110px
    }

    h1,
    h2,
    h3 {
      font-family: "Familjen Grotesk", system-ui, sans-serif;
      margin: 0;
      letter-spacing: -.01em
    }

    h1 {
      font-size: 2rem;
      line-height: 1.1
    }

    h2 {
      font-size: 1.2rem;
      margin: 22px 0 10px
    }

    h3 {
      font-size: 1.05rem
    }

    p {
      margin: 0 0 8px
    }

    .mute {
      color: var(--mute)
    }

    .small {
      font-size: .9rem
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center
    }

    .sp {
      justify-content: space-between
    }

    :focus-visible {
      outline: 3px solid var(--ac);
      outline-offset: 2px
    }

    .btn {
      background: var(--ac);
      color: var(--acink);
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      font: 600 15px Figtree, sans-serif;
      cursor: pointer
    }

    .btn.g {
      background: none;
      color: var(--ink);
      border: 1.5px solid var(--line)
    }

    .btn.d {
      background: none;
      color: var(--bad);
      border: 1.5px solid var(--line)
    }

    .btn.s {
      padding: 7px 12px;
      font-size: 14px
    }

    .bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      background: var(--sf);
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: center;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px))
    }

    .bar button {
      flex: 1;
      max-width: 150px;
      background: none;
      border: 0;
      padding: 6px 4px;
      font: 600 12px Figtree, sans-serif;
      color: var(--mute);
      cursor: pointer;
      border-radius: 10px
    }

    .bar button svg {
      display: block;
      margin: 0 auto 2px
    }

    .bar button[aria-current="true"] {
      color: var(--ac)
    }

    .hero {
      background: var(--hero);
      color: var(--heroink);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px
    }

    .hero p {
      opacity: .85;
      margin: 0
    }

    .hero .eb {
      font-size: .9rem;
      margin-bottom: 4px
    }

    .pan {
      background: var(--sf);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px
    }

    .next {
      background: var(--sf);
      border: 1px solid var(--line);
      border-left: 8px solid var(--c);
      border-radius: 6px 16px 16px 6px;
      padding: 16px;
      margin-top: 14px
    }

    .next small {
      color: var(--mute);
      font-weight: 600
    }

    .next h2 {
      margin: 2px 0 4px;
      font-size: 1.4rem
    }

    .first {
      background: var(--bg);
      border-radius: 10px;
      padding: 8px 12px;
      margin: 10px 0
    }

    .warn {
      background: var(--hi);
      color: #2A2205;
      border-radius: 12px;
      padding: 10px 14px;
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px
    }

    .warn .btn {
      background: #2A2205;
      color: #fff
    }

    .chips {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px
    }

    .chip {
      flex: none;
      min-width: 120px;
      background: var(--sf);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px
    }

    .chip b {
      font: 800 1.6rem "Familjen Grotesk", sans-serif;
      display: block;
      line-height: 1
    }

    .chip.soon {
      border-color: var(--hi);
      box-shadow: inset 0 0 0 1px var(--hi)
    }

    .ln {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 8px 0;
      border-top: 1px solid var(--line)
    }

    .ln:first-child {
      border-top: 0
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: none;
      background: var(--c)
    }

      text = text.replace(/<think>[\s\S]*?<\/think>/g, ""); if (!text.trim()) throw new Error("The AI sent back nothing. Try again."); return text
    }
    function aiSetHTML() {const k = AI.key(); return `<div class="pan"><b>AI</b><p class="small mute" style="margin:4px 0 8px">${k ? "AI is on. Your key is saved only on this device." : "Paste a Groq API key to build and update plans with AI. It’s saved only on this device. Get one free at console.groq.com/keys."}</p><label for="sk">API key</label><input id="sk" type="password" autocomplete="off" placeholder="${k ? "Saved: " + k.slice(0, 7) + "…" + k.slice(-4) : "gsk_…"}"><label for="sm">Model</label><input id="sm" value="${esc(AI.model())}" autocomplete="off"><div class="row"><button class="btn g s" id="sks">Save</button><button class="btn g s" id="skt">Test</button>${k ? `<button class="btn d s" id="skr">Remove key</button>` : ""}</div><div id="skm" class="small" style="margin-top:8px"></div></div>`}
    function bindAISet() {
      const m = $("#skm"); if (!m) return;
      $("#sks").onclick = () => {const v = $("#sk").value.trim(), md = $("#sm").value.trim(); try {if (v) {if (!/^gsk_/.test(v)) {m.innerHTML = `<span class="err">That doesn’t look like a Groq key. It starts with gsk_.</span>`; return } localStorage.setItem("planner-akey", v)} localStorage.setItem("planner-amodel", md || GROQ_TEXT)} catch (e) { } render()};
      $("#skt").onclick = async () => {m.textContent = "Testing…"; try {const t = await aiAsk("Reply with the single word: ok", {max: 20}); m.innerHTML = `<span class="okmsg">Works. The AI replied: ${esc(t.trim().slice(0, 40))}</span>`} catch (e) {m.innerHTML = `<span class="err">${esc(e.message)}</span>`} };
      const r = $("#skr"); if (r) r.onclick = () => {try {localStorage.removeItem("planner-akey")} catch (e) { } render()};
    }
    const askPrompt = () => `I want a study plan. Here is what I told you:\n${formInfo()}\n\nToday is ${TODAY}. Do you need anything important from me before you can build an accurate plan? Ask at most 5 short questions, only about things that are missing or unclear (exam dates, my fixed weekly schedule, when I am free, which topics are on each exam). Do not ask about anything I already told you. If nothing important is missing, ask nothing. Reply with ONLY JSON like {"questions":["..."]}.`;
    function vImport() {
      const f = formGet(), h = f.h || "2 months", has = S.tasks.length > 0, ai = aiReady(), er = t => `<span class="err">${esc(t)}</span>`;
      const fld = (k, l, ph, rows) => `<label for="fm_${k}">${l}</label>${rows ? `<textarea id="fm_${k}" rows="${rows}" placeholder="${esc(ph)}">${esc(f[k] || "")}</textarea>` : `<input id="fm_${k}" value="${esc(f[k] || "")}" placeholder="${esc(ph)}">`}`;
      const manual = `<div class="pan"><b style="font-size:1.1rem">${ai ? "A. " : "2. "}Send it to an AI</b><p class="small mute" style="margin:2px 0 10px">This copies one message that already has everything the AI needs.</p>
   <button class="btn" id="cp" style="width:100%;padding:14px">Copy my message</button><div id="cpm" class="small" style="margin:8px 0"></div>
   <div class="row"><a class="btn g s" href="https://claude.ai/new" target="_blank" rel="noopener" style="text-decoration:none">Open Claude</a><a class="btn g s" href="https://chatgpt.com/" target="_blank" rel="noopener" style="text-decoration:none">Open ChatGPT</a></div>
   <p class="small mute" style="margin:10px 0 0">Paste the message there and send it. If it asks questions, answer them. Then copy its final reply (the JSON).</p>
   <details style="margin-top:8px"><summary class="small" style="cursor:pointer;font-weight:600">See the message</summary><textarea class="code" id="pr" rows="8" readonly></textarea></details></div>
  <div class="pan"><b style="font-size:1.1rem">${ai ? "B. " : "3. "}Paste the reply here</b><textarea class="code" id="pt" rows="5" placeholder="Paste the AI’s reply here…" style="margin-top:8px"></textarea>
   <div class="row" style="margin-bottom:10px"><button class="btn g s" id="pc">Paste from clipboard</button></div>
   <label for="md">When importing</label><select id="md"><option value="replace" ${has ? "" : "selected"}>Replace my current plan</option><option value="update" ${has ? "selected" : ""}>Update: keep past and finished tasks</option><option value="add">Add to my current plan</option></select>
   <button class="btn" id="im" style="width:100%;padding:14px">Build my planner</button><div id="msg" style="margin-top:10px"></div>
   <details style="margin-top:10px"><summary class="small" style="cursor:pointer;font-weight:600">Have a file instead?</summary><input id="fl" type="file" accept=".json,.txt,application/json,text/plain" style="margin-top:8px"></details></div>`;
      $("#v").innerHTML = `<h1 style="margin-bottom:4px">${has ? "Import" : "Set up your plan"}</h1><p class="mute small">${ai ? "Tell me about your term and AI builds the schedule. You check it before anything is added." : "Three quick steps. An AI builds the schedule, and you paste it back here."}</p>
  ${ai ? "" : `<div class="pan"><b style="font-size:1.1rem">Turn on AI (one time)</b><p class="small mute" style="margin:2px 0 10px">Paste your Groq API key and this app builds your plan for you, with no copying and pasting. The key stays on this device. Get one free at console.groq.com/keys.</p><input id="ak" type="password" placeholder="gsk_…" autocomplete="off"><button class="btn" id="aks">Save key</button><div id="akm" class="small" style="margin-top:6px"></div></div>`}
  <div class="pan"><b style="font-size:1.1rem">1. Tell me about your term</b><p class="small mute" style="margin:2px 0 10px">A few words each is plenty. Skip anything that doesn’t apply.</p>
   ${fld("g", "What are you working toward? Include dates.", "Biochem exam Nov 20. Anatomy practical Dec 3. Case write-up due Nov 28.", 3)}
   <label for="fm_h">How far ahead should I plan?</label><select id="fm_h">${["2 weeks", "1 month", "2 months", "3 months", "Whole semester"].map(o => `<option ${o === h ? "selected" : ""}>${o}</option>`).join("")}</select>
   ${fld("x", "Fixed commitments (lectures, labs, shifts)", "Anatomy lecture Mon–Fri 9am–12pm. Clinic Thu 1–6pm.", 3)}
   ${fld("fr", "When are you free to study?", "Weekdays after 4pm, Saturday mornings")}
   ${fld("o", "Other things to get done (optional)", "Laundry on Sundays, gym 3 times a week, email the registrar", 2)}
   <label style="display:flex;gap:10px;align-items:flex-start;margin-top:4px"><input type="checkbox" id="fm_q" ${f.q === false ? "" : "checked"} style="width:20px;height:20px;margin:2px 0 0;flex:none"><span>Let the AI ask me a few questions first. This avoids guesses and makes the plan more accurate.</span></label></div>
  ${ai ? `<div class="pan"><b style="font-size:1.1rem">2. Build it with AI</b><p class="small mute" style="margin:2px 0 10px">Optional: add a screenshot of your timetable or exam schedule.</p><input id="aif" type="file" accept="image/*"><button class="btn" id="aib" style="width:100%;padding:14px">Build my plan</button><div id="aim" class="small" style="margin-top:10px"></div><div id="aiq"></div></div>
  <details style="margin-bottom:12px"><summary class="small" style="cursor:pointer;font-weight:600;padding:6px 0">Prefer to copy and paste instead?</summary>${manual}</details>` : manual}
  ${has ? `<h2>Keep it up to date</h2><p class="small mute">Once a week, fill in detailed tasks for the next two weeks.</p>${ai ? `<button class="btn" id="aiu">Fill in the next 2 weeks with AI</button><div id="aium" class="small" style="margin:6px 0"></div>` : ""}<button class="btn g" id="c2" style="margin-top:6px">Copy “detail the next 2 weeks” message</button><div id="c2m" class="small" style="margin-top:6px"></div>` : ""}
  <h2>More</h2><div class="row"><button class="btn g s" id="ex">Try an example</button><button class="btn g s" id="cx">Copy plan backup</button><button class="btn d s" id="cl">Clear everything</button></div><div id="cxm" class="small" style="margin-top:6px"></div><textarea class="code" id="xp" rows="3" readonly style="margin-top:10px"></textarea>`;
      const read = () => {const o = {g: $("#fm_g").value, h: $("#fm_h").value, x: $("#fm_x").value, fr: $("#fm_fr").value, o: $("#fm_o").value, q: $("#fm_q").checked}; try {localStorage.setItem("planner-form", JSON.stringify(o))} catch (e) { } return o};
      ["g", "h", "x", "fr", "o", "q"].forEach(k => $("#fm_" + k).addEventListener("change", () => {read(); $("#pr").value = aiPrompt(formInfo())}));
      $("#pr").value = aiPrompt(formInfo());
      const ak = $("#aks"); if (ak) ak.onclick = () => {const v = $("#ak").value.trim(); if (!/^gsk_/.test(v)) {$("#akm").innerHTML = er("That doesn’t look like a Groq key. It starts with gsk_."); return } try {localStorage.setItem("planner-akey", v)} catch (e) { } render()};
      const ab = $("#aib"); if (ab) ab.onclick = async () => {
        const o = read(), m = $("#aim"), qa = $("#aiq"), img = $("#aif").files[0], imgs = img ? [img] : null; qa.innerHTML = "";
        if (!o.g.trim() && !img) {m.innerHTML = er("Add your goals in step 1, or attach a screenshot."); return }
        const build = async extra => {qa.innerHTML = ""; m.textContent = "Building your plan…"; try {const t = await aiAsk(aiPrompt(formInfo() + (extra ? "\n\nMy answers to your questions:\n" + extra : ""), true), {images: imgs, max: 14000, onProgress: n => m.textContent = "Building your plan… " + Math.round(n / 1000) + "k characters"}); const p = parse(t); if (p.err) {m.innerHTML = er(p.err); return } m.textContent = ""; review(p, has ? "update" : "replace")} catch (e) {m.innerHTML = er(e.message)} };
        try {
          if (o.q) {
            m.textContent = "Checking what I need to ask…"; const t = await aiAsk(askPrompt(), {images: imgs, max: 1500}); let qs = []; try {qs = JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}") + 1)).questions || []} catch (e) { } qs = qs.slice(0, 5);
            if (qs.length) {m.textContent = ""; qa.innerHTML = `<p class="small"><b>A few quick questions</b> (skip any you like):</p>` + qs.map((q, i) => `<label for="aq${i}">${esc(q)}</label><input id="aq${i}">`).join("") + `<button class="btn" id="aigo">Continue</button>`; $("#aigo").onclick = () => build(qs.map((q, i) => "Q: " + q + "\nA: " + ($("#aq" + i).value.trim() || "(no answer)")).join("\n")); return }
          }
          await build("")
        } catch (e) {m.innerHTML = er(e.message)}
      };
      const aiu = $("#aiu"); if (aiu) aiu.onclick = async () => {const m = $("#aium"); m.textContent = "Working…"; try {const t = await aiAsk(prompt2(), {max: 14000, onProgress: n => m.textContent = "Working… " + Math.round(n / 1000) + "k characters"}); const p = parse(t); if (p.err) {m.innerHTML = er(p.err); return } m.textContent = ""; review(p, "update")} catch (e) {m.innerHTML = er(e.message)} };
      const cp = async (text, msg, okText) => {
        let ok = false; try {await navigator.clipboard.writeText(text); ok = true} catch (e) { }
        if (!ok) {try {const t = $("#pr"); t.value = text; t.closest("details").open = true; t.select(); ok = document.execCommand("copy")} catch (e) { } }
        msg.innerHTML = ok ? `<span class="okmsg">${okText}</span>` : er("Couldn’t copy automatically. Tap and hold in the box that opened, choose Select All, then Copy.")
      };
      $("#cp").onclick = () => {const o = read(); if (!o.g.trim()) {$("#cpm").innerHTML = er("Add at least your goals or deadlines in step 1."); return } const t = aiPrompt(formInfo()); $("#pr").value = t; cp(t, $("#cpm"), "Copied. Now paste it into your AI.")};
      const c2 = $("#c2"); if (c2) c2.onclick = () => cp(prompt2(), $("#c2m"), "Copied. Paste it into your AI, then import the reply with “Update”.");
      $("#xp").value = JSON.stringify({title: S.title, milestones: S.milestones, weeks: S.weeks, tasks: S.tasks});
      $("#cx").onclick = () => cp($("#xp").value, $("#cxm"), "Backup copied. Paste it somewhere safe.");
      $("#pc").onclick = async () => {try {const t = await navigator.clipboard.readText(); if (!t.trim()) throw 0; $("#pt").value = t; $("#msg").innerHTML = `<span class="okmsg">Pasted. Now tap Build my planner.</span>`} catch (e) {$("#msg").innerHTML = er("Couldn’t read the clipboard. Tap and hold in the box above and choose Paste.")} };
      const run = txt => {if (!txt.trim()) {$("#msg").innerHTML = er("Paste the AI’s reply first."); return } const p = parse(txt); if (p.err) {$("#msg").innerHTML = `<div class="err">${esc(p.err)}</div>`; return } $("#msg").innerHTML = ""; review(p, $("#md").value)};
      $("#im").onclick = () => run($("#pt").value);
      $("#fl").onchange = e => {const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => run(String(r.result)); r.readAsText(f)};
      $("#ex").onclick = () => {
        const m = add(TODAY, 35); run(JSON.stringify({
          title: "Biology midterm", assumptions: ["Free weekdays 4–6pm"],
          milestones: [{title: "Biology midterm", date: m, type: "exam"}], weeks: [{start: mon(TODAY), focus: "Cell respiration and genetics basics"}, {start: add(mon(TODAY), 7), focus: "Practice problems"}],
          routines: [{title: "Flashcard review", days: ["mon", "wed", "fri"], start: "16:00", estimateMin: 20, to: m}],
          tasks: [{title: "Recall sprint: cell respiration", date: TODAY, start: "16:30", estimateMin: 30, group: "Biology", doneWhen: "10 questions answered from memory", firstStep: "Open a blank page and write question 1", ifThen: {if: "I get stuck for 5 minutes", then: "Flag it and move on"}}, {title: "Genetics practice set", date: add(TODAY, 1), start: "16:00", estimateMin: 40, group: "Biology"}]
        }))
      };
      $("#cl").onclick = () => {
        open(`<h2 style="margin-top:0">Clear everything?</h2><p>This deletes your plan from this browser.</p><div class="row"><button class="btn d" id="y">Delete</button><button class="btn g" id="n">Cancel</button></div>`);
        $("#y").onclick = () => {S = Object.assign(S, {title: "My plan", milestones: [], weeks: [], tasks: []}); save(); close()}; $("#n").onclick = close
      };
    }
    render();
    if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => { }));
  </script>
</body>

</html>
