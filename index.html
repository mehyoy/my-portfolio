<style>
:root{--f:"Fredoka",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#e9f3fa;--card:#fff;--ink:#12303f;--mut:#5d7886;--acc:#1783c4;--ok:#1f9d55;--bad:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1822;--card:#152b3a;--ink:#e6f3fb;--mut:#8fb0c2;--acc:#3fa9e8}}
:root[data-theme="dark"]{--bg:#0b1822;--card:#152b3a;--ink:#e6f3fb;--mut:#8fb0c2;--acc:#3fa9e8}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-user-select:none;user-select:none}
button{font:inherit;border:0;border-radius:12px;padding:11px 14px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer;touch-action:manipulation}
button.sec{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
button.big{width:100%;padding:15px;font-size:18px}
button:disabled{opacity:.5}
.mut{color:var(--mut);font-size:13px}.hide{display:none!important}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.row>button{flex:1}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0003;border-left:5px solid var(--acc)}
.wk{border:1.5px solid #8884;border-radius:12px;padding:8px;margin:8px 0}
.wk label{display:flex;gap:8px;align-items:center;padding:5px 2px}.wk .cats{margin-left:22px}
input[type=checkbox]{width:20px;height:20px}
/* title */
#title{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;color:#fff;cursor:pointer;background:linear-gradient(180deg,rgba(255,170,110,.22),rgba(30,25,90,.5));backdrop-filter:blur(1.5px) saturate(1.15);-webkit-backdrop-filter:blur(1.5px) saturate(1.15)}
.tcard{text-align:center;padding:30px 44px 26px;border-radius:30px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 20px 60px #0005,inset 0 0 40px rgba(255,255,255,.08);max-width:94vw}
.logo{font-size:64px;animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px) rotate(-8deg)}}
h1.t{font:700 clamp(44px,12vw,92px)/1 var(--f);margin:4px 0 0;color:#fff;text-shadow:0 4px 0 #c2410c,0 8px 0 #7c2d12,0 18px 30px #0008}
.tag{font-size:clamp(14px,3.6vw,19px);margin:14px 0 20px;text-shadow:0 2px 8px #0008}
.click{display:inline-block;font-weight:700;font-size:18px;padding:10px 22px;border-radius:999px;background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.55);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07);background:rgba(255,255,255,.35)}}
#t1{width:100%;max-width:520px;cursor:default;text-align:center}
.t2{font:700 38px/1 var(--f);margin:0 0 12px;text-shadow:0 3px 0 #c2410c,0 10px 22px #0008}
.panel{background:color-mix(in srgb,var(--card) 90%,transparent);color:var(--ink);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:20px;padding:14px;text-align:left;box-shadow:0 14px 40px #0006;max-height:58vh;overflow:auto;margin-bottom:14px;border:1px solid rgba(255,255,255,.4)}
.play{width:100%;font-size:24px;padding:16px;border-radius:18px;background:linear-gradient(#ffb02e,#f97316);box-shadow:0 6px 0 #b45309,0 12px 24px #0005;text-shadow:0 2px 0 #b45309}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #b45309}
.hint2{font-size:13px;opacity:.9;text-shadow:0 1px 4px #000a}
body.intro{overflow:hidden}
body.intro #game{max-width:none;padding:0;margin:0}
body.intro #scene{border-radius:0;border:0;box-shadow:none}
body.intro #ov,body.intro #gear,body.intro #fsb,body.intro #snb,body.intro #hot,body.intro #hud,body.intro #msg,body.intro .ctl,body.intro .hint{visibility:hidden}
/* controls overlay + settings */
#ov{display:none;position:absolute;left:0;right:0;bottom:84px;padding:0 12px;pointer-events:none}
body.ov #ov{display:flex;justify-content:space-between;align-items:flex-end}
body.ov.lh #ov{flex-direction:row-reverse}
body.ov .ctl,body.ov .hint{display:none}
body.ov #prompt{bottom:152px}
body.ov #pwrap{left:140px;right:96px;bottom:104px}
.ovm{display:flex;gap:10px}
#ov button{pointer-events:auto;touch-action:none;-webkit-touch-callout:none;border-radius:50%;padding:0;width:56px;height:56px;font-size:22px;color:#fff;text-shadow:0 1px 4px #0008;border:2px solid rgba(255,255,255,.6);background:rgba(10,30,50,var(--op,.45));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);box-shadow:0 2px 10px #0004}
#ov button:active{background:rgba(255,176,46,.85);transform:scale(.94)}
#ov #ovc{width:68px;height:68px;font-size:28px;background:rgba(249,115,22,calc(var(--op,.45)*.95))}
#gear,#fsb,#snb{position:absolute;right:8px;top:42px;width:36px;height:36px;padding:0;border-radius:50%;background:#0006;font-size:17px;border:1.5px solid #fff5;backdrop-filter:blur(4px)}
#fsb{top:84px}#snb{top:126px}
.sel{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;margin:6px 0;background:var(--bg);color:var(--ink);border:2px solid #8886;border-radius:14px;padding:12px}
.sel.on{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 35%,transparent)}
.sheet input[type=range]{width:55%;padding:0}
/* hotbar */
#hot{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;max-width:96%;overflow-x:auto;padding:6px;background:#0007;border-radius:16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);scrollbar-width:none}
#hot::-webkit-scrollbar{display:none}
.slot{position:relative;flex:0 0 auto;width:54px;height:54px;padding:0;border-radius:12px;background:#0b1e2ecc;border:2.5px solid #ffffff44;font-size:27px;display:flex;align-items:center;justify-content:center;box-shadow:none;transition:transform .15s}
.slot i{position:absolute;top:2px;left:5px;font:600 11px var(--f);color:#fff;opacity:.85}
.slot b{position:absolute;bottom:1px;right:5px;font:700 12px var(--f);color:#fff}
.slot.on{background:#1d4d70;border-color:#ffd166!important;transform:translateY(-5px);box-shadow:0 0 14px #ffd16688}
.slot.pop{animation:sp .7s}@keyframes sp{30%{transform:scale(1.35) translateY(-8px)}}
.slot svg{display:block;pointer-events:none}.ri{display:flex;transform:rotate(-32deg)}
.dex b svg{display:block;margin:0 auto}
/* game */
#game{height:100%;max-width:none;margin:0;padding:0;display:flex;flex-direction:column}
#scene{position:relative;flex:1 1 auto;min-height:140px;border-radius:0;overflow:hidden;border:0;touch-action:none}
#cv{display:block;position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.hl{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#0008;color:#fff;border-radius:999px;padding:4px 11px;font-weight:600;font-size:14px;white-space:nowrap;backdrop-filter:blur(4px)}
@media (max-width:480px){.chip{font-size:12px;padding:3px 8px}.hl{flex-wrap:nowrap;gap:4px}#msg{font-size:15px;top:48px}}
#msg{position:absolute;top:46px;left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:17px;text-shadow:0 2px 5px #000a;padding:0 50px;pointer-events:none}
#prompt{position:absolute;bottom:74px;left:50%;transform:translateX(-50%);background:#ffd166;color:#4a2c10;box-shadow:0 4px 0 #b8860b;animation:pl 1s ease-in-out infinite;white-space:nowrap}
@keyframes pl{50%{transform:translateX(-50%) scale(1.06)}}
#pwrap{position:absolute;bottom:76px;left:20%;right:20%;height:16px;background:#0007;border-radius:9px;overflow:hidden;border:2px solid #fff6}
#pw{height:100%;width:0;background:linear-gradient(90deg,#4ade80,#facc15,#ef4444)}
#catch{position:absolute;inset:0;background:#000a;display:flex;align-items:center;justify-content:center}
.cc{background:var(--card);border-radius:20px;padding:18px 26px;text-align:center;animation:pop .35s;box-shadow:0 0 40px #ffd16680}.cc .em{font-size:68px}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.ctl{display:flex;gap:8px;margin:0;padding:8px 10px 2px;flex:none}.ctl button{padding:15px;font-size:17px;touch-action:none}
#castb{flex:1;background:linear-gradient(#ffb02e,#f97316);box-shadow:0 4px 0 #b45309}
.mv{width:64px;background:#2b4a63;box-shadow:0 4px 0 #14293a}
@media (hover:hover) and (pointer:fine){.touch{display:none}}
.hint{text-align:center;margin:2px 0 6px;flex:none}@media (max-height:520px){.hint{display:none}}
.qt{font-size:18px;font-weight:600;margin:6px 0 10px;-webkit-user-select:text;user-select:text}
.opt{display:block;width:100%;text-align:left;margin:7px 0;background:var(--bg);color:var(--ink);border:1.5px solid #8886}
.opt.ok{background:var(--ok);color:#fff}.opt.bad{background:var(--bad);color:#fff}
input[type=text],textarea,select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1.5px solid #8886;background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;margin:6px 0;font-size:14px}
#qcard{flex:0 1 auto;max-height:50%;overflow:auto;margin:0;border-radius:16px 16px 0 0;overscroll-behavior:contain}
#fb{margin-top:8px;font-size:14px;-webkit-user-select:text;user-select:text}
.modal{position:fixed;left:0;top:0;width:100%;height:100%;height:100dvh;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:9}
@media (min-width:720px){.modal{align-items:center}.sheet{border-radius:20px!important}}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:88%;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:20px 20px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 8px;display:flex;justify-content:space-between}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #8883}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.dex div{background:var(--bg);border-radius:10px;padding:8px;text-align:center;font-size:12px}.dex b{display:block;font-size:26px}
.r-Common{color:#8a9aa5}.r-Uncommon{color:#2fa84f}.r-Rare{color:#2f7de0}.r-Epic{color:#a84fd6}.r-Legendary{color:#e69a00}
</style></head><body class="intro">
<div id="title">
  <div id="t0" class="tcard"><div class="logo">🎣</div><h1 class="t">Quiz Fisher</h1>

  <div id="t1" class="hide"><h2 class="t2">🎣 Pick your topics</h2>
    <div class="panel"><div class="row" style="margin:0 0 8px"><button class="sec" onclick="selAll(1)">Select all</button><button class="sec" onclick="selAll(0)">Clear</button></div>
      <div class="ulist"></div><p class="ucnt mut"></p></div>

</div>
<main id="game">
  <div id="scene"><canvas id="cv"></canvas>
    <div id="ov"><div class="ovm"><button id="ovl">◀</button><button id="ovr">▶</button></div><button id="ovc">🎣</button></div>
    <button id="gear" onclick="settings();this.blur()" aria-label="Settings">⚙️</button><button id="fsb" onclick="toggleFS();this.blur()" aria-label="Fullscreen" title="Fullscreen (F)">⛶</button><button id="snb" onclick="toggleMute();this.blur()" aria-label="Mute" title="Mute (M)">🔊</button>
    <div id="hud"><div class="hl"><span class="chip">🪙 <span id="hc"></span></span><span class="chip">🔥 <span id="hs"></span></span><span class="chip">✅ <span id="ha"></span></span></div><span class="chip" id="hl"></span></div>

</main>

<script>
const DATA=[{"week":1,"weekLabel":"Week 1","groups":[{"category":"Biosphere & Cells","questions":[{"type":"mc","q":"Which of the following is <em>not<\/em> one of the properties of life shown in Figure 1.2?","opts":["Order","Energy processing","Photosynthesis","Reproduction"],"answer":2,"exp":"Figure 1.2 lists order, evolutionary adaptation, regulation, energy processing, growth and development, response to the environment, and reproduction. Photosynthesis isn't one of the listed properties."},{"type":"tf","q":"A single property is enough to define whether something is alive.","answer":false,"exp":"The notes state that a set of properties is used to define life — that's part of why defining life is problematic."},{"type":"list","q":"List the properties of life shown in Figure 1.2.","model":"Order, evolutionary adaptation, regulation, energy processing, growth and development, response to the environment, and reproduction."},{"type":"mc","q":"In the levels of biological organization (Figure 1.3), which level sits directly above \"Organisms\"?","opts":["Populations","Organs","Communities","Cells"],"answer":0,"exp":"The order runs Biosphere → Ecosystems → Communities → Populations → Organisms → Organs → Tissues → Cells → Organelles → Molecules, so Populations sits just above Organisms."},{"type":"mc","q":"Which is the correct definition of the biosphere?","opts":["All individuals of the same species in an area","All the environments on Earth inhabited by life (land, water, atmosphere)","A group of cells of similar structure and function","All living things in a particular area plus non-living components"],"answer":1,"exp":"The biosphere = all environments on Earth inhabited by life. Option D describes an ecosystem, not the biosphere."},{"type":"tf","q":"An ecosystem is defined as biotic plus abiotic components.","answer":true,"exp":"An ecosystem is all the living things in an area along with the non-living components (soil, water, gases, light) — biotic + abiotic."},{"type":"fill","q":"What is the simplest structural and functional unit of life?","accept":["cell","the cell"],"exp":"The correct answer is the cell."},{"type":"list","q":"State the three principles of Schleiden and Schwann's Cell Theory.","model":"(1) All organisms are made up of cells. (2) All cells come only from pre-existing cells. (3) The cell is the basic structural and functional unit of an organism."},{"type":"mc","q":"Which of these structures IS found in a prokaryotic cell?","opts":["Nucleus","Mitochondria","Ribosomes","Membrane-bound organelles"],"answer":2,"exp":"Prokaryotic cells lack a nucleus and membrane-bound organelles (including mitochondria), but they do have ribosomes."},{"type":"tf","q":"Prokaryotic cells are only found in Domains Bacteria and Archaea.","answer":true,"exp":"Correct — the slides note prokaryotic cells occur \"only in Domains Bacteria and Archaea.\""},{"type":"mc","q":"Domain Eukarya includes all of the following EXCEPT:","opts":["Protists","Fungi","Animals","Archaea"],"answer":3,"exp":"Archaea are prokaryotes and form their own domain. Eukarya consists of protists, plants, fungi, and animals."},{"type":"match","q":"Match each cell structure to its main function.","pairs":[["Mitochondrion","Cellular respiration"],["Chloroplast","Photosynthesis"],["Golgi apparatus","Modification and sorting of proteins/lipids"],["Lysosome","Breakdown of ingested substances and damaged organelles"],["Ribosome","Protein synthesis"],["Nucleus","Houses chromosomes"]],"exp":"These pairings come straight from the \"Tour of the Cell\" table."},{"type":"mc","q":"\"Typically two membranes around a fluid stroma, which contains thylakoids stacked into grana\" describes which organelle?","opts":["Mitochondrion","Chloroplast","Lysosome","Golgi apparatus"],"answer":1,"exp":"That structure — stroma, thylakoids, grana — describes the chloroplast, site of photosynthesis."},{"type":"fill","q":"What is the name of the model describing the arrangement of phospholipids and proteins in the plasma membrane?","accept":["fluid mosaic model","fluid mosaic"],"exp":"The correct term is the fluid mosaic model."},{"type":"tf","q":"The plasma membrane is selectively permeable.","answer":true,"exp":"Correct — it controls the movement of gases, nutrients, and wastes into and out of the cell."},{"type":"list","q":"List three structures found in plant cells that are not typical of animal cells.","model":"Chloroplasts, a large central vacuole, and a cell wall (plasmodesmata is also acceptable)."},{"type":"mc","q":"The plant cell wall is made mostly of:","opts":["Chitin","Peptidoglycan","Cellulose","Keratin"],"answer":2,"exp":"Plant cell walls are made of cellulose. (Fungal cell walls are chitin; bacterial cell walls are peptidoglycan.)"},{"type":"essay","q":"Explain the relationship between the nucleus and ribosomes in a eukaryotic cell, mentioning the role of the nucleolus.","model":"The nucleus houses the chromosomes (chromatin = DNA + proteins) and contains the nucleolus, where ribosomal subunits are made. These subunits pass out through the nuclear pores into the cytoplasm, where they assemble into functioning ribosomes that carry out protein synthesis."},{"type":"mc","q":"Which of these is part of the endomembrane system?","opts":["Mitochondrion","Chloroplast","Golgi apparatus","Cell wall"],"answer":2,"exp":"The endomembrane system includes the nuclear envelope, ER, Golgi complex, lysosomes, vacuoles, and the cell membrane — not mitochondria, chloroplasts, or the cell wall."},{"type":"tf","q":"According to the concept of emergent properties, new properties appear at each level of organization that were not present at simpler levels.","answer":true,"exp":"Correct — this is the basis of \"the whole is greater than the sum of the individual parts.\""},{"type":"fill","q":"\"The whole is greater than the sum of the individual parts\" is a description of what concept?","accept":["emergent properties","emergent property"],"exp":"This describes emergent properties."},{"type":"list","q":"List the functions of the cell wall.","model":"Protect the cell, maintain cell shape, and prevent excessive water uptake."},{"type":"list","q":"List, in order from broadest to narrowest, the ten levels of biological organization shown in Figure 1.3.","model":"Biosphere → Ecosystems → Communities → Populations → Organisms → Organs → Tissues → Cells → Organelles → Molecules."}]},{"category":"Taxonomy & Phylogeny","questions":[{"type":"mc","q":"Who first proposed the binomial system of nomenclature, in the 18th century?","opts":["Charles Darwin","Carolus Linnaeus","Schleiden and Schwann","Alfred Russel Wallace"],"answer":1,"exp":"Carolus Linnaeus proposed the binomial system in the 18th century."},{"type":"list","q":"What are the two parts of a binomial species name, and give one example from the notes.","model":"A binomial has a Genus (noun) and a specific epithet/species name (adjective) — for example, Homo sapiens (human), Castor canadensis (beaver), or Ursus maritimus (polar bear)."},{"type":"fill","q":"How many domains make up the three-domain system of classification?","accept":["3","three"],"exp":"There are 3 domains: Bacteria, Archaea, and Eukarya."},{"type":"match","q":"Match each domain to its description.","pairs":[["Domain Bacteria","Prokaryotes, unicellular, cell wall of peptidoglycan"],["Domain Archaea","Prokaryotes, unicellular, cell wall (non-peptidoglycan)"],["Domain Eukarya","Eukaryotes: protists, plants, fungi, and animals"]],"exp":"Domains Bacteria and Archaea are both prokaryotic but differ in cell wall composition; Eukarya covers all eukaryotic life."},{"type":"tf","q":"Domains are more inclusive (broader) than kingdoms.","answer":true,"exp":"Correct — domains, followed by kingdoms, are described as the broadest taxa of classification."},{"type":"mc","q":"Which kingdom is described as multicellular, autotrophic, with cell walls of cellulose?","opts":["Kingdom Fungi","Kingdom Animalia","Kingdom Plantae","Domain Archaea"],"answer":2,"exp":"Kingdom Plantae: multicellular, autotrophs, cellulose cell walls."},{"type":"mc","q":"Which kingdom is described as mostly multicellular, absorptive heterotrophs, with cell walls of chitin?","opts":["Kingdom Plantae","Kingdom Fungi","Kingdom Animalia","Protists"],"answer":1,"exp":"Kingdom Fungi: mostly multicellular, absorptive heterotrophs, chitin cell walls."},{"type":"mc","q":"Which kingdom is described as multicellular, ingestive heterotrophs?","opts":["Kingdom Animalia","Kingdom Fungi","Kingdom Plantae","Domain Bacteria"],"answer":0,"exp":"Kingdom Animalia: multicellular, ingestive heterotrophs."},{"type":"list","q":"List the Linnaean taxonomic categories from broadest to narrowest (8 levels).","model":"Domain, Kingdom, Phylum, Class, Order, Family, Genus, Species."},{"type":"fill","q":"What are the groups/categories in Linnaean classification called (singular form)?","accept":["taxa","taxon"],"exp":"They're called taxa (singular: taxon)."},{"type":"mc","q":"Which branch of biology uses the fossil record, morphological/biochemical resemblances, and DNA comparisons to classify species and study their evolutionary relationships?","opts":["Genetics","Systematics","Ecology","Physiology"],"answer":1,"exp":"Systematics is defined this way in the notes, and it encompasses both taxonomy and phylogeny."},{"type":"tf","q":"Systematics includes both taxonomy and phylogeny.","answer":true,"exp":"Correct — the diagram in the notes shows Systematics branching into Taxonomy and Phylogeny."},{"type":"mc","q":"A group of species that includes an ancestral species and ALL of its descendants is called a:","opts":["Kingdom","Clade","Genus","Polytomy"],"answer":1,"exp":"That's a clade — it is monophyletic because the common ancestor and all its descendants are represented."},{"type":"mc","q":"Groups that share an immediate common ancestor not shared by any other group are called:","opts":["Basal taxa","Sister taxa","Polytomies","Homologs"],"answer":1,"exp":"These are sister taxa — for example, chimps and humans in the sample tree."},{"type":"fill","q":"What term describes a taxon that diverges early in the history of a group, originating near the group's common ancestor?","accept":["basal taxon","basal"],"exp":"This is called a basal taxon."},{"type":"mc","q":"A branch point in a phylogenetic tree from which more than two groups emerge is called a:","opts":["Clade","Polytomy","Sister taxon","Root"],"answer":1,"exp":"That's a polytomy."},{"type":"tf","q":"Rotating the branches of a phylogenetic tree around a branch point changes the evolutionary relationships it represents.","answer":false,"exp":"False — tree branches can be rotated around a branch point WITHOUT changing the evolutionary relationships shown."},{"type":"mc","q":"A rooted phylogenetic tree includes a branch that represents:","opts":["A polytomy","The last common ancestor of all taxa in the tree","A sister taxon","An analogous structure"],"answer":1,"exp":"A rooted tree includes a branch representing the last common ancestor of all the taxa shown."},{"type":"list","q":"What does a phylogenetic tree represent, in terms of what kind of scientific statement it is?","model":"A phylogenetic tree represents a hypothesis about the evolutionary relationships among the organisms/taxa shown."},{"type":"fill","q":"Name the two domains that consist entirely of prokaryotic organisms.","accept":["bacteria and archaea","archaea and bacteria","bacteria, archaea"],"exp":"Domain Bacteria and Domain Archaea are both prokaryotic; Domain Eukarya is eukaryotic."},{"type":"essay","q":"Describe how Linnaean classification and phylogeny are related, and note one way they can differ.","model":"Linnaean classification groups species into a hierarchy of increasingly broad categories (taxa), and systematists try to make that hierarchy reflect phylogeny — the evolutionary relatedness and history of the species. However, Linnaean classification and phylogeny can sometimes differ from each other, which is why some systematists have proposed classification schemes that recognize only monophyletic groups (clades) — groups that include a common ancestor and all its descendants."},{"type":"match","q":"Using the beaver example (Figure 26.4), match each taxonomic rank to its classification.","pairs":[["Species","Castor canadensis"],["Genus","Castor"],["Family","Castoridae"],["Order","Rodentia"],["Class","Mammalia"],["Phylum","Chordata"],["Kingdom","Animalia"],["Domain","Eukarya"]],"exp":"This is the full hierarchical classification of the beaver, from narrowest (species) to broadest (domain)."}]},{"category":"Viruses","questions":[{"type":"tf","q":"Viruses are cells.","answer":false,"exp":"False — the notes explicitly state \"Viruses are not cells.\""},{"type":"mc","q":"The protein coat that encloses a virus's nucleic acid is called the:","opts":["Envelope","Capsomere","Capsid","Nucleoid"],"answer":2,"exp":"That's the capsid, which is composed of subunits called capsomeres."},{"type":"fill","q":"What are the protein subunits that make up a capsid called?","accept":["capsomeres","capsomere"],"exp":"They're called capsomeres."},{"type":"mc","q":"A virus is classified as a \"DNA virus\" or \"RNA virus\" based on:","opts":["Whether it has an envelope","The type of nucleic acid in its genome","Its host range","Its capsid shape"],"answer":1,"exp":"The classification depends on the type of nucleic acid (DNA or RNA) making up the viral genome."},{"type":"list","q":"List the four possible forms a viral genome can take.","model":"Double-stranded DNA, single-stranded DNA, double-stranded RNA, or single-stranded RNA."},{"type":"tf","q":"All viruses have a membranous envelope.","answer":false,"exp":"False — viruses consist of nucleic acid in a capsid, and only some, in some cases, also have a membranous envelope."},{"type":"mc","q":"Viruses are described as \"obligate intracellular parasites\" because:","opts":["They can only reproduce within a host cell","They only infect plants","They lack a capsid","They can survive indefinitely outside a cell"],"answer":0,"exp":"Viruses reproduce only within a host cell — they are obligate intracellular parasites."},{"type":"fill","q":"What term describes the limited number of host cells/species that a given virus can infect?","accept":["host range"],"exp":"This is called the virus's host range."},{"type":"match","q":"Match each virus family to whether it has a membranous envelope (Yes/No), per Table 19.1.","pairs":[["Adenovirus","No"],["Herpesvirus","Yes"],["Poxvirus","Yes"],["Coronavirus","Yes"],["Picornavirus","No"],["Retrovirus","Yes"]],"exp":"Table 19.1 lists envelope status for each virus family/class."},{"type":"mc","q":"SARS and MERS are examples of diseases caused by which virus family?","opts":["Picornavirus","Coronavirus","Filovirus","Togavirus"],"answer":1,"exp":"SARS and MERS are caused by coronaviruses."},{"type":"mc","q":"The common cold (rhinovirus) and poliovirus belong to which virus family?","opts":["Picornavirus","Orthomyxovirus","Retrovirus","Reovirus"],"answer":0,"exp":"Picornaviruses include rhinovirus, poliovirus, and hepatitis A virus."},{"type":"mc","q":"HIV, the virus that causes AIDS, belongs to which class of virus?","opts":["Filovirus","Rhabdovirus","Retrovirus","Parvovirus"],"answer":2,"exp":"HIV is a retrovirus."},{"type":"fill","q":"What enzyme do retroviruses use to copy their RNA genome into DNA?","accept":["reverse transcriptase"],"exp":"Retroviruses use reverse transcriptase for this reverse transcription step."},{"type":"list","q":"List, in order, the main steps of the simplified viral replicative cycle (Figure 19.5).","model":"(1) The virus enters the cell and is uncoated, releasing viral DNA and capsid proteins. (2) Host enzymes replicate the viral genome, while (3) host enzymes transcribe the viral genome into viral mRNA, which host ribosomes use to make more capsid proteins. (4) Viral genomes and capsid proteins self-assemble into new virus particles, which exit the cell."},{"type":"essay","q":"Explain why it's difficult to classify viruses as strictly living or non-living, referencing at least two points from the notes.","model":"Viruses cannot reproduce or carry out metabolic activities outside of a host cell, which argues against them being \"alive.\" Yet they are structurally complex, contain genetic material, can replicate (inside a host), and viral populations can evolve — properties associated with living things. This is why the notes describe viruses as leading \"a kind of borrowed life\" between life-forms and chemicals."},{"type":"mc","q":"According to the notes, what are proposed evolutionary sources of viral genomes?","opts":["Ribosomes and mitochondria","Plasmids and transposons","Capsids and envelopes","Chloroplasts and vacuoles"],"answer":1,"exp":"Candidates include plasmids (circular DNA in bacteria/yeasts) and transposons (small mobile DNA segments)."},{"type":"fill","q":"Plasmids, transposons, and viruses are all examples of what kind of genetic element?","accept":["mobile genetic elements","mobile"],"exp":"They are all mobile genetic elements."},{"type":"mc","q":"Chicken pox/shingles and cold sores are caused by viruses in which family?","opts":["Poxvirus","Herpesvirus","Reovirus","Flavivirus"],"answer":1,"exp":"Herpesvirus includes herpes simplex I/II (cold sores), varicella zoster (shingles, chicken pox), and Epstein-Barr virus."},{"type":"tf","q":"According to the course notes, SARS-CoV-2 is an airborne pathogen.","answer":true,"exp":"Correct — the notes state SARS-CoV-2 is airborne, and that vaccination, masks, ventilation, and air filtration reduce transmission."},{"type":"mc","q":"Measles virus and mumps virus belong to which family?","opts":["Paramyxovirus","Rhabdovirus","Filovirus","Togavirus"],"answer":0,"exp":"Paramyxovirus includes measles virus and mumps virus."},{"type":"mc","q":"Rabies is caused by a virus in which family?","opts":["Rhabdovirus","Orthomyxovirus","Coronavirus","Reovirus"],"answer":0,"exp":"Rabies virus belongs to the Rhabdovirus family."}]},{"category":"Evolution","questions":[{"type":"mc","q":"Evolution is best defined as:","opts":["The study of the geographic distribution of species","The process by which the genetic composition of a population changes over time","The classification of species into taxa","The breakdown of ingested substances in a cell"],"answer":1,"exp":"Evolution = the process by which the genetic composition of a population changes over time."},{"type":"list","q":"List the observations Darwin made that led him to the theory of natural selection.","model":"Individuals in a population have traits that vary; many of these traits are heritable; more offspring are produced than survive; competition is inevitable; and species generally suit their environment."},{"type":"fill","q":"What did Darwin call the process by which the environment \"selects\" for beneficial traits?","accept":["natural selection"],"exp":"Darwin called this natural selection."},{"type":"tf","q":"Genetic variation is described as the raw material of evolution.","answer":true,"exp":"Correct — without genetic variation, natural selection has nothing to act on."},{"type":"mc","q":"Which of the following is NOT listed as a source of genetic variation?","opts":["Existing variation","Mutations","Sexual reproduction (meiosis and random fertilization)","Photosynthesis"],"answer":3,"exp":"The sources listed are existing variation, sexual reproduction (meiosis, randomness of fertilization), and mutations — not photosynthesis."},{"type":"list","q":"List the requirements for natural selection to occur.","model":"Genetic (heritable) variation must exist within a population; that variation must lead to differential reproductive success (survival and number of offspring) in the environment; and the favourable traits must be inherited by offspring."},{"type":"mc","q":"Besides natural selection, what other two mechanisms of evolution are listed in the notes?","opts":["Mutation and photosynthesis","Genetic drift and gene flow","Homology and analogy","Taxonomy and systematics"],"answer":1,"exp":"The other mechanisms are genetic drift (including the bottleneck and founder effects) and gene flow."},{"type":"fill","q":"What term describes the production of random evolutionary changes in small breeding populations?","accept":["genetic drift"],"exp":"This is genetic drift — it can enhance or eliminate certain genetic make-ups."},{"type":"mc","q":"According to the notes, the bottleneck effect is a form of genetic drift that:","opts":["Increases variation among populations over time","Results in genetic drift having a large impact on a population","Only happens in prokaryotic cells","Is caused by movement of fertile individuals between populations"],"answer":1,"exp":"The notes define it as: \"Bottleneck effect – results in genetic drift having a large impact on a population.\""},{"type":"mc","q":"When a few individuals become isolated from a larger population and form a new population whose gene pool doesn't reflect the original population, this is called the:","opts":["Bottleneck effect","Founder effect","Gene flow","Convergent evolution"],"answer":1,"exp":"That's the founder effect — another example of genetic drift."},{"type":"fill","q":"What is the transfer of alleles from one population to another, due to movement of fertile individuals or their gametes, called?","accept":["gene flow"],"exp":"This is gene flow."},{"type":"tf","q":"Gene flow tends to increase variation among populations over time.","answer":false,"exp":"False — gene flow tends to REDUCE variation among populations over time."},{"type":"match","q":"Match each evolutionary mechanism to its description.","pairs":[["Natural selection","The environment selects for beneficial, heritable traits"],["Genetic drift","Random changes in genetic make-up in small populations"],["Gene flow","Transfer of alleles between populations via movement of individuals/gametes"]],"exp":"These are the three mechanisms of evolutionary change described in the notes."},{"type":"essay","q":"In the soapberry bug example (Figure 22.13), what evidence suggests natural selection acted on beak length in the central Florida population?","model":"There is variation in beak length within both populations. The central Florida soapberry bugs, which now feed on the introduced goldenrain tree, have a shorter average beak length than the historical (museum specimen) average, which reflected beak length on the native balloon vine. This shift toward shorter beaks — better suited to the smaller fruit of the introduced host plant — is evidence that the population's beak length has evolved by natural selection in response to a change in food source."},{"type":"mc","q":"The rise of Methicillin Resistant Staphylococcus aureus (MRSA) is presented in the notes as an example of:","opts":["Gene flow reducing variation","The evolution of drug-resistant bacteria","Comparative embryology","The founder effect"],"answer":1,"exp":"MRSA is presented as an example of the evolution of drug-resistant bacteria (evolution in action)."},{"type":"list","q":"Put these events from the MRSA timeline in chronological order: methicillin introduced; penicillin-resistant S. aureus identified; penicillin introduced; methicillin-resistant S. aureus identified.","model":"1943 – penicillin introduced → 1945 – penicillin-resistant strains of S. aureus identified (producing penicillinase) → 1959 – methicillin introduced → 1961 – methicillin-resistant strains of S. aureus identified."},{"type":"fill","q":"What term describes similarity between species that results from common ancestry?","accept":["homology"],"exp":"This is called homology."},{"type":"mc","q":"Human, cat, whale, and bat forelimbs share the same underlying bone structure but different functions. These are examples of:","opts":["Analogous structures","Homologous structures","Convergent structures","Basal structures"],"answer":1,"exp":"These are homologous structures — an underlying similarity from common ancestry despite different functions."},{"type":"mc","q":"Structures in distantly related species that have no similarity in underlying structure but share a similar function are called:","opts":["Homologous structures","Sister taxa","Analogous structures","Basal taxa"],"answer":2,"exp":"These are analogous structures, resulting from convergent evolution."},{"type":"fill","q":"What term describes the evolution of similar (analogous) features in distantly related groups that independently adapted to similar environments?","accept":["convergent evolution"],"exp":"This is convergent evolution — e.g., the sugar glider and flying squirrel."},{"type":"tf","q":"Convergent evolution provides good information about the ancestry/relatedness of species.","answer":false,"exp":"False — the notes state convergent evolution does NOT provide information about ancestry, since it reflects similar function, not shared ancestry."},{"type":"mc","q":"Structures like pharyngeal pouches and post-anal tails, seen in the embryos of many vertebrates, are studied under:","opts":["Biogeography","Comparative embryology","The fossil record","Cladistics"],"answer":1,"exp":"Comparative embryology often reveals homology among structures not evident in adult forms, such as pharyngeal pouches and post-anal tails."},{"type":"list","q":"List the categories of evidence supporting evolution mentioned in the notes.","model":"Evolution in action (direct observation), homology (comparative anatomy and comparative embryology), the fossil record, and biogeography."},{"type":"fill","q":"What term describes the study of the geographical distribution of species, which first suggested evolution to Darwin?","accept":["biogeography"],"exp":"This is biogeography."},{"type":"tf","q":"Islands and island archipelagos have provided strong evidence for evolution.","answer":true,"exp":"Correct — the notes highlight islands and archipelagos as strong evidence within the study of biogeography."},{"type":"tf","q":"Darwin's ideas about natural selection had deep historical roots, building on thinkers like Lyell, Malthus, Cuvier, and Hutton.","answer":true,"exp":"Correct — Figure 22.2 traces this intellectual context leading up to On the Origin of Species (1859)."}]}]},{"week":2,"weekLabel":"Week 2","groups":[{"category":"Prokaryotes (Bacteria & Archaea)","questions":[{"type":"mc","q":"Which structural feature distinguishes prokaryotic cells from eukaryotic cells?","opts":["A membrane-bound nucleus and organelles","Absence of membrane-bound organelles, including a nucleus","The presence of ribosomes","A phospholipid plasma membrane"],"answer":1,"exp":"Prokaryotes lack a true nucleus and membrane-bound organelles, though they do have ribosomes like all cells."},{"type":"mc","q":"Compared to viruses, prokaryotes are best described as:","opts":["Obligate intracellular parasites","Metabolically independent cells that can reproduce on their own","Non-living infectious particles","Structures that require a host to replicate"],"answer":1,"exp":"Unlike viruses, prokaryotes are made of cells, are metabolically independent, and reproduce on their own."},{"type":"mc","q":"Which of the following is NOT one of the three common prokaryotic cell shapes?","opts":["Cocci","Bacilli","Spirals","Cubes"],"answer":3,"exp":"The three common shapes are cocci (spheres), bacilli (rods), and spirals — not cubes."},{"type":"tf","q":"The prokaryotic cell wall functions to produce ATP.","answer":false,"exp":"False — the cell wall maintains shape, provides protection, and prevents bursting in a hypotonic environment. ATP production is a metabolic function, not a cell wall function."},{"type":"mc","q":"In a hypertonic environment, prokaryotic cells tend to:","opts":["Burst","Plasmolyze, which reduces cell division","Undergo binary fission more rapidly","Form endospores automatically"],"answer":1,"exp":"In hypertonic environments, prokaryotes plasmolyze, which reduces cell division."},{"type":"fill","q":"What molecule makes up the bacterial (Domain Bacteria) cell wall?","accept":["peptidoglycan"],"exp":"Domain Bacteria cell walls are made of peptidoglycan."},{"type":"mc","q":"Archaeal cell walls differ from bacterial cell walls because they:","opts":["Are made of cellulose","Contain polysaccharides and proteins but lack peptidoglycan","Are made entirely of chitin","Have no cell wall at all"],"answer":1,"exp":"Archaea cell walls contain polysaccharides and proteins, but lack peptidoglycan."},{"type":"mc","q":"Penicillin is effective against many bacteria because it targets:","opts":["The plasma membrane","The peptidoglycan cell wall","Ribosomes","The nucleoid"],"answer":1,"exp":"Penicillin specifically targets the peptidoglycan cell wall."},{"type":"tf","q":"Gram-negative bacteria tend to be MORE resistant to antibiotics than Gram-positive bacteria.","answer":true,"exp":"True — Gram-negative bacteria have less peptidoglycan plus a toxic outer membrane, increasing antibiotic resistance."},{"type":"list","q":"List three reasons prokaryotes are able to reach immense population sizes.","model":"Small cell size, rapid reproduction by binary fission, and short generation times."},{"type":"mc","q":"How do most bacteria reproduce?","opts":["Meiosis","Binary fission","Budding exclusively","Spore formation only"],"answer":1,"exp":"Binary fission is the primary means of bacterial reproduction."},{"type":"mc","q":"Endospores, such as those produced by Bacillus anthracis, are notable because they:","opts":["Are destroyed instantly by boiling water","Can remain dormant for hundreds of years under harsh conditions","Only form in eukaryotic cells","Are a form of sexual reproduction"],"answer":1,"exp":"Endospores can survive extreme conditions, including boiling water, and remain dormant for very long periods."},{"type":"match","q":"Match each oxygen-related metabolic category to its description.","pairs":[["Obligate aerobe","Requires oxygen for cellular respiration"],["Obligate anaerobe","Poisoned by oxygen; uses fermentation or anaerobic respiration"],["Facultative anaerobe","Can survive with or without oxygen"]],"exp":"These three categories describe how different prokaryotes relate to oxygen in metabolism."},{"type":"mc","q":"The cyanobacterium Anabaena is notable for performing all of the following EXCEPT:","opts":["Photosynthesis","Oxygen production","Nitrogen fixation","Absorptive heterotrophy"],"answer":3,"exp":"Anabaena performs photosynthesis, oxygen production, nitrogen fixation, and metabolic cooperation — not absorptive heterotrophy."},{"type":"fill","q":"What term describes a surface-coating colony of bacteria held together by signalling molecules and adherent proteins/sugars?","accept":["biofilm"],"exp":"This is called a biofilm — implicated in effects ranging from tooth decay to contamination of medical equipment."},{"type":"tf","q":"Archaea share traits with both bacteria and eukaryotes.","answer":true,"exp":"True — archaea are a distinct domain, but share some features with each of the other two domains."},{"type":"match","q":"Match each type of archaeal extremophile to its environment.","pairs":[["Extreme halophile","Highly saline environments"],["Extreme thermophile","Very hot environments"],["Acidophile","Very acidic environments (pH below 1)"],["Methanogen","Anaerobic bogs and digestive tracts; produces methane"]],"exp":"These four extremophile categories cover the range of harsh environments archaea are known to inhabit."},{"type":"mc","q":"Which of the following is an ecological role of bacteria, rather than a human use of bacteria?","opts":["Cheese and yoghurt production","Nitrogen fixation by Rhizobium in legume roots","Commercial synthesis of vitamins","Production of antibiotics"],"answer":1,"exp":"Nitrogen fixation is an ecological role; cheese production, vitamin synthesis, and antibiotics are human uses, not ecological roles."},{"type":"tf","q":"The human body is estimated to host roughly 10 times more bacterial cells than human cells.","answer":true,"exp":"True — the human microbiome has been estimated at roughly 10 times the number of human cells."},{"type":"mc","q":"Lyme disease, caused by the spirochete Borrelia burgdorferi, is spread to humans by:","opts":["Mosquitoes","Ticks","Airborne transmission","Contaminated water"],"answer":1,"exp":"Ticks spread Borrelia burgdorferi from deer and mice to humans, causing Lyme disease."},{"type":"mc","q":"Exotoxins, such as those causing cholera and botulism, are notable because they:","opts":["Are only released when the bacteria die","Can cause disease even if the producing bacteria are no longer present","Are found only in Gram-negative cell walls","Require a host with no immune system"],"answer":1,"exp":"Exotoxins can cause disease even after the prokaryotes producing them are gone — unlike endotoxins, which are released only when bacteria die."},{"type":"essay","q":"Explain the difference between exotoxins and endotoxins, using cholera/botulism and lipopolysaccharide-release as examples.","model":"Exotoxins are toxic proteins secreted by living bacteria (e.g., Vibrio cholerae causing cholera, Clostridium botulinum causing botulism) and can cause disease even after the bacteria producing them are gone. Endotoxins, by contrast, are rich in lipopolysaccharide and are released only when bacteria die and their cell walls break down — they are a structural part of the bacterium itself rather than a secreted product."},{"type":"mc","q":"In terms of size, prokaryotic cells are described in your notes as:","opts":["The largest cells on Earth, typically 50-500 µm","The smallest cells on Earth, typically 0.5-5 µm","Roughly the same size as eukaryotic cells","Too variable in size to characterize"],"answer":1,"exp":"Prokaryotic cells are the smallest cells on Earth, typically 0.5-5 µm in size."},{"type":"tf","q":"Prokaryotic cells usually have complex internal compartmentalization similar to eukaryotic cells.","answer":false,"exp":"False — prokaryotic cells usually lack complex compartmentalization, though some have specialized membranes (e.g., respiratory or thylakoid membranes) that perform metabolic functions."},{"type":"mc","q":"Specialized membranes seen in some prokaryotes, such as the thylakoid membranes of photosynthetic prokaryotes, function to:","opts":["Replace the cell wall","Perform metabolic functions such as cellular respiration or photosynthesis","Store the cell's DNA","Enable binary fission"],"answer":1,"exp":"Specialized membranes (e.g., respiratory membranes, thylakoid membranes) perform metabolic functions like respiration and photosynthesis."},{"type":"match","q":"Match each major nutritional mode to its energy and carbon sources (Table 27.1).","pairs":[["Photoautotroph","Energy from light; carbon from CO2 (e.g., cyanobacteria, plants, some protists)"],["Chemoautotroph","Energy from inorganic chemicals; carbon from CO2 (e.g., Sulfolobus)"],["Photoheterotroph","Energy from light; carbon from organic compounds (e.g., Rhodobacter)"],["Chemoheterotroph","Energy from organic compounds; carbon from organic compounds (e.g., Clostridium, animals, fungi)"]],"exp":"Table 27.1 lists four major nutritional modes based on energy source (light vs. chemicals) and carbon source (CO2 vs. organic compounds)."},{"type":"fill","q":"Animals are described in your notes as ingestive _______ (fill in the nutritional mode).","accept":["chemoheterotrophs","chemoheterotroph"],"exp":"Animals are ingestive chemoheterotrophs — they ingest organic compounds as both their energy and carbon source."},{"type":"fill","q":"Fungi are described in your notes as absorptive _______ (fill in the nutritional mode).","accept":["chemoheterotrophs","chemoheterotroph"],"exp":"Fungi are absorptive chemoheterotrophs — they absorb organic compounds after secreting digestive enzymes onto their food source."},{"type":"mc","q":"According to the comparison of the three domains of life, growth of which domain is usually inhibited by the antibiotics streptomycin and chloramphenicol?","opts":["Archaea","Eukarya","Bacteria","All three domains equally"],"answer":2,"exp":"Bacterial growth is usually inhibited by streptomycin and chloramphenicol, while Archaea and Eukarya are generally not inhibited by them."},{"type":"mc","q":"Which feature is present in Eukarya but absent in both Bacteria and Archaea, according to the domain comparison table?","opts":["A nuclear envelope and membrane-enclosed organelles","A circular chromosome","Ribosomes","A plasma membrane"],"answer":0,"exp":"A nuclear envelope and membrane-enclosed organelles are present only in Eukarya; Bacteria and Archaea both lack them."},{"type":"tf","q":"Growth at temperatures above 100°C occurs in some archaea species, but not in bacteria or eukaryotes.","answer":true,"exp":"True — some archaea species can grow above 100°C, unlike bacteria and eukaryotes."}]},{"category":"Protists","questions":[{"type":"mc","q":"The serial endosymbiosis hypothesis proposes that, during eukaryote evolution:","opts":["Chloroplasts evolved before mitochondria","Mitochondria evolved before plastids through a sequence of endosymbiotic events","Mitochondria and chloroplasts appeared simultaneously","Eukaryotes evolved directly from viruses"],"answer":1,"exp":"Serial endosymbiosis proposes mitochondria evolved before plastids, through a sequence of endosymbiotic events."},{"type":"list","q":"List the evidence supporting an endosymbiotic origin for mitochondria and plastids.","model":"Similarities in inner membrane structure and function to prokaryotes; division similar to some prokaryotes; they transcribe and translate their own DNA; and their ribosomes are more similar to prokaryotic ribosomes than to eukaryotic ones."},{"type":"mc","q":"Which observation supports mitochondria being acquired BEFORE chloroplasts in eukaryote evolution?","opts":["Almost all eukaryotes have mitochondria, but only autotrophic eukaryotes have chloroplasts","All eukaryotes have chloroplasts but not mitochondria","Chloroplasts appear in every domain of life","Mitochondria are only found in plants"],"answer":0,"exp":"Since nearly all eukaryotes have mitochondria but only autotrophs have chloroplasts, mitochondria were likely acquired first."},{"type":"tf","q":"The products of photosynthesis can be fully metabolized without any mitochondrial enzymes.","answer":false,"exp":"False — mitochondrial enzymes are needed to fully metabolize the products of photosynthesis, which supports mitochondria being acquired first."},{"type":"fill","q":"What informal term refers to eukaryotes that are not plants, animals, or fungi?","accept":["protist","protists"],"exp":"This informal, convenient term is protist."},{"type":"tf","q":"With the exception of the algae, most protists are multicellular.","answer":false,"exp":"False — with the exception of algae, most protists are unicellular."},{"type":"mc","q":"Volvox is described in your notes as an example of a:","opts":["Unicellular protist","Colonial protist","Multicellular fungus","Prokaryotic cyanobacterium"],"answer":1,"exp":"Volvox is regarded as a colonial protist."},{"type":"match","q":"Match each eukaryotic supergroup to organisms found within it.","pairs":[["Excavata","Euglenozoans and giardia"],["SAR clade","Paramecium, brown algae, dinoflagellates, diatoms"],["Archaeplastida","Red algae, green algae, and land plants"],["Unikonta","Slime molds, amoebae, fungi, and animals"]],"exp":"These four eukaryotic supergroups reflect a phylogenetic hypothesis of eukaryotic diversity."},{"type":"mc","q":"A protist that is photoautotrophic, such as algae, obtains nutrition through:","opts":["Ingesting other organisms","Photosynthesis","Absorbing organic matter from dead material","A combination of predation and photosynthesis at all times"],"answer":1,"exp":"Photoautotrophs like algae obtain energy through photosynthesis."},{"type":"mc","q":"An amoeba, which engulfs food particles, is an example of a(n):","opts":["Photoautotroph","Ingestive chemoheterotroph","Absorptive chemoheterotroph","Mixotroph"],"answer":1,"exp":"Amoebas ingest food particles, making them ingestive chemoheterotrophs."},{"type":"mc","q":"A slime mold, which absorbs nutrients from its surroundings, is an example of a(n):","opts":["Photoautotroph","Ingestive chemoheterotroph","Absorptive chemoheterotroph","Mixotroph"],"answer":2,"exp":"Slime molds absorb nutrients, making them absorptive chemoheterotrophs."},{"type":"fill","q":"Euglena, which can both photosynthesize and ingest food, is an example of what nutritional category?","accept":["mixotroph","mixotrophs"],"exp":"Euglena is a mixotroph, combining more than one nutritional strategy."},{"type":"tf","q":"Asexual reproduction in protists, via mitosis, produces offspring genetically identical to the parent.","answer":true,"exp":"True — asexual reproduction (mitosis) produces clones, while sexual reproduction (meiosis and fertilization) increases genetic variation."},{"type":"mc","q":"Dinoflagellates are associated with a harmful ecological phenomenon known as:","opts":["Biofilm formation","Red tide","Mycorrhizae","Lichenization"],"answer":1,"exp":"Certain dinoflagellates can cause \"red tide\" blooms."},{"type":"essay","q":"Explain why the serial endosymbiosis hypothesis proposes mitochondria were acquired before chloroplasts, using at least two pieces of evidence.","model":"Two lines of evidence support mitochondria being acquired first. First, the products of photosynthesis could not be fully metabolized without mitochondrial enzymes, so a cell would have needed mitochondria before chloroplasts would be useful. Second, almost all eukaryotes have mitochondria, but only autotrophic eukaryotes have chloroplasts — suggesting mitochondria were acquired earlier in eukaryotic evolution, before the lineage split into autotrophic and heterotrophic groups."},{"type":"mc","q":"Which eukaryotic supergroup includes the pathogen Plasmodium along with ciliates and diatoms?","opts":["Excavata","SAR clade","Archaeplastida","Unikonta"],"answer":1,"exp":"The SAR clade (Stramenopila, Alveolata, Rhizaria) includes Plasmodium, ciliates, and diatoms."},{"type":"list","q":"List the two reproductive strategies used by protists, and state which one increases genetic variation.","model":"Asexual reproduction (mitosis, producing clones) and sexual reproduction (meiosis and fertilization). Sexual reproduction is the one that increases genetic variation."},{"type":"match","q":"Match each ecological role of protists to an example from your notes.","pairs":[["Decomposer","Slime molds and water molds break down dead organic material"],["Food for animals","Small animals feed on protists"],["Produce oxygen","Photosynthetic protists (e.g., Euglena) release O2 and fix carbon"],["Cause disease","Late potato blight, malaria, amoebic dysentery, and Giardia"]],"exp":"Protists play major ecological roles as decomposers, food sources, oxygen producers, and disease-causing agents."},{"type":"mc","q":"Late potato blight, a significant agricultural disease caused by a protist, results in:","opts":["Potatoes rotting in the ground","Increased potato yield","Nitrogen fixation in potato roots","A red tide in nearby water"],"answer":0,"exp":"Late potato blight is a protist-caused agricultural disease that makes potatoes rot in the ground."},{"type":"mc","q":"Giardia intestinalis, a protist that causes intestinal illness, belongs to which group?","opts":["Diplomonads","Parabasalids","Dinoflagellates","Ciliates"],"answer":0,"exp":"Giardia intestinalis is a diplomonad."},{"type":"mc","q":"Trichomonas vaginalis, a protist pathogen, belongs to which group?","opts":["Diplomonads","Parabasalids","Apicomplexans","Foraminiferans"],"answer":1,"exp":"Trichomonas vaginalis is a parabasalid, identifiable by its undulating membrane and flagella."},{"type":"tf","q":"Trypanosomes are pathogenic protists that live and move among red blood cells in the bloodstream.","answer":true,"exp":"True — trypanosomes are pathogenic protists found moving among red blood cells."},{"type":"fill","q":"What genus of protist is named in your notes as the cause of a toxic \"red tide\"?","accept":["gonyaulax","gonyaulax concatenensis"],"exp":"Gonyaulax concatenensis is the protist named as causing red tide."},{"type":"mc","q":"Which of the following is NOT one of the multicellular chlorophyte examples given in your notes (Zygnema, Ulva, Caulerpa)?","opts":["Zygnema, a filamentous pond alga","Ulva, or sea lettuce","Caulerpa, a multinucleate \"supercell\" alga","Volvox, a colonial protist"],"answer":3,"exp":"Volvox is described separately as a colonial protist, not among the multicellular chlorophyte examples (Zygnema, Ulva, Caulerpa)."}]},{"category":"Kingdom Fungi","questions":[{"type":"mc","q":"Which statement about fungi is correct?","opts":["Fungi are prokaryotic and unicellular","Fungi are eukaryotic and generally multicellular, with yeasts as a unicellular exception","Fungi are always motile","Fungi lack cell walls entirely"],"answer":1,"exp":"Fungi are eukaryotic and generally multicellular; yeasts (e.g., Candida albicans) are the unicellular exception."},{"type":"fill","q":"What molecule makes up the fungal cell wall?","accept":["chitin"],"exp":"Fungal cell walls are made of chitin (plant cell walls are cellulose)."},{"type":"tf","q":"Fungi are motile organisms that actively swim through their environment as adults.","answer":false,"exp":"False — fungi are non-motile and grow from the ends of linear bodies (hyphae)."},{"type":"mc","q":"Which of the following is a unicellular fungus (yeast) mentioned in your notes?","opts":["Penicillium notatum","Saccharomyces cerevisiae","Grosmannia clavigera","Rhizobium"],"answer":1,"exp":"Saccharomyces cerevisiae, along with Candida albicans and Cryptococcus neoformans, is a unicellular yeast."},{"type":"mc","q":"Fungi obtain nutrition as:","opts":["Photoautotrophs","Ingestive chemoheterotrophs","Absorptive chemoheterotrophs","Obligate anaerobic autotrophs"],"answer":2,"exp":"Fungi are absorptive chemoheterotrophs, consistent with their roles as decomposers and pathogens."},{"type":"tf","q":"Many fungi are saprophytic, meaning they feed on dead or decaying organic matter.","answer":true,"exp":"True — saprophytic fungi are decomposers, feeding on dead organic matter."},{"type":"fill","q":"What is the name of the group that unites fungi with animals and their close protistan relatives in fungal phylogeny?","accept":["opisthokonts","opisthokonta"],"exp":"Fungi and animals (plus close protistan relatives) are grouped together as Opisthokonts."},{"type":"mc","q":"Which group is identified as the basal taxon in fungal diversity, distinguished by flagellated spores?","opts":["Chytrids","Glomeromycetes","Ascomycetes","Basidiomycetes"],"answer":0,"exp":"Chytrids are the basal taxon in fungal diversity, notable for their flagellated spores."},{"type":"mc","q":"Mycorrhizae are best described as:","opts":["A parasitic relationship where fungi harm plant roots","A mutualistic, cooperative association between plant roots and fungi","A type of fungal pathogen affecting pine forests","A synonym for lichen"],"answer":1,"exp":"Mycorrhizae are mutualistic associations between plant roots and fungi."},{"type":"fill","q":"Which group of fungi is named as forming arbuscular mycorrhizae?","accept":["glomeromycetes","glomeromycota"],"exp":"Glomeromycetes form arbuscular mycorrhizae."},{"type":"list","q":"Describe what a lichen is, including what each partner contributes.","model":"A lichen is a symbiotic association between a photosynthetic microorganism (algae or cyanobacteria) and a fungus. The photosynthetic partner contributes glucose from photosynthesis; the fungal partner contributes minerals, water, and protection."},{"type":"mc","q":"The fungal component of most lichens belongs to which group?","opts":["Chytrids","Glomeromycetes","Ascomycetes","Basidiomycetes exclusively"],"answer":2,"exp":"The fungal component of most lichens is an ascomycete."},{"type":"tf","q":"Lichens can tolerate high levels of air pollution.","answer":false,"exp":"False — lichens can inhabit some of the barest landscapes on Earth, from deserts to the arctic, but cannot tolerate much air pollution."},{"type":"mc","q":"Grosmannia clavigera (blue stain fungus), which has damaged BC's lodgepole pine forests, is transmitted by:","opts":["Ticks","Mosquitoes","The mountain pine beetle","Wind currents alone"],"answer":2,"exp":"The mountain pine beetle transmits Grosmannia clavigera, damaging lodgepole pine forests."},{"type":"mc","q":"Which of the following is a commercial/human use of fungi mentioned in your notes?","opts":["Nitrogen fixation in legume roots","Antibiotic production by Penicillium notatum","Formation of biofilms on teeth","Causing red tide blooms"],"answer":1,"exp":"Penicillium notatum is used commercially for antibiotic production."},{"type":"match","q":"Match each example to the type of fungal ecological role it represents.","pairs":[["Penicillium (decomposer mould)","Decomposer / nutrient cycling"],["Grosmannia clavigera on lodgepole pine","Pathogen"],["Mycorrhizae with plant roots","Mutualism"],["Lichen (fungus + alga/cyanobacterium)","Mutualism"]],"exp":"Fungi play several distinct ecological roles: decomposers, pathogens, and mutualists."},{"type":"essay","q":"Explain why fungi are classified as absorptive chemoheterotrophs, and how this connects to their ecological roles.","model":"Fungi obtain nutrition by secreting digestive enzymes onto organic material and then absorbing the resulting smaller molecules, rather than ingesting food internally (like animals) or producing their own food via photosynthesis (like plants). This absorptive, heterotrophic strategy is directly connected to their ecological roles as decomposers (breaking down dead organic matter, including lignin in wood) and as pathogens (absorbing nutrients from living hosts)."},{"type":"fill","q":"In the structure of a multicellular fungus, what is the name for the mass of hyphae that spreads through soil or a food source?","accept":["mycelium"],"exp":"The mass of hyphae is called the mycelium; the mushroom itself is the reproductive structure, with spore-producing structures underneath the cap."},{"type":"mc","q":"\"Farmer\" ants that cultivate fungi for food are an example of:","opts":["Parasitism","Fungal mutualism","Predation","Competition"],"answer":1,"exp":"Farmer ants and their cultivated fungi are an example of fungal mutualism, alongside mycorrhizae and lichens."},{"type":"mc","q":"The mold Aspergillus growing on grains is a health concern because it produces:","opts":["Penicillin","Carcinogenic compounds such as aflatoxin","Peptidoglycan","Chitin"],"answer":1,"exp":"Aspergillus growing on grains produces carcinogenic compounds, including aflatoxin."},{"type":"mc","q":"Fungal pathogens of plants mentioned in your notes include corn smut, tar spot fungus, and:","opts":["Ergots on rye","Athlete's foot","Cryptococcus neoformans","Aflatoxin"],"answer":0,"exp":"Corn smut, tar spot fungus, and ergots on rye are all examples of fungal pathogens affecting plants."},{"type":"mc","q":"Athlete's foot and vaginal yeast infections are examples of fungi acting as:","opts":["Decomposers of dead wood","Pathogens of animals","Mutualistic partners","Growth promoters for plants"],"answer":1,"exp":"Athlete's foot and vaginal infections are examples of fungal pathogens affecting animals (including humans)."},{"type":"list","q":"Describe the soybean/mycorrhizae experiment from your notes, including the treatments and the conclusion.","model":"Researchers grew soybean plants in soil treated with fungicide to prevent mycorrhizae from forming (experimental group), and compared them to a control group with fungi that formed normal mycorrhizae. The fungicide-treated plants were stunted, likely due to a phosphorus deficiency, while the control plants with mycorrhizae were taller and healthier. This supported the hypothesis that mycorrhizae enhance a plant's ability to take up phosphate and other needed minerals."},{"type":"fill","q":"According to your notes, mycorrhizae enhance mineral uptake in what percentage of vascular plants?","accept":["95","95%"],"exp":"Mycorrhizae enhance mineral uptake from the soil in roughly 95% of vascular plants."}]}]},{"week":3,"weekLabel":"Week 3","groups":[{"category":"Plant Origins & Adaptations","questions":[{"type":"mc","q":"Which of the following is a defining trait of all plants?","opts":["Prokaryotic cell structure","Cell walls made of cellulose","Heterotrophic nutrition","Exclusively aquatic habitat"],"answer":1,"exp":"Plants are eukaryotic, photosynthetic, and have cellulose cell walls — a trait shared with their green algal ancestors."},{"type":"list","q":"List the four characteristics of plants given in your notes.","model":"Eukaryotic (with cell walls made of cellulose, shared with green algae); multicellular; autotrophic (photosynthetic); and primarily terrestrial."},{"type":"list","q":"List the four benefits of early land colonization named in your notes.","model":"Nutrient- and mineral-rich soils; unfiltered sunshine; higher atmospheric CO2 compared to water; and initially, no herbivores or pathogens."},{"type":"match","q":"Match each challenge of life on land to the plant innovation(s) that addressed it.","pairs":[["Dehydration","Embryophytes, sporopollenin on spores/pollen, cuticle and stomata"],["UV light damage from sunlight","Cuticle"],["Long transport distances","Vascular tissue"],["Lack of structural support","Lignin"],["Reproduction away from standing water","Progression from flagellated sperm to spores to pollen to seeds"]],"exp":"Each major challenge of terrestrial life drove a specific, identifiable innovation in plant evolution."},{"type":"fill","q":"What term describes a new feature that first appeared (by mutation) in the most recent common ancestor of a group — essentially, an evolutionary innovation?","accept":["derived trait","derived"],"exp":"A derived trait is a new feature not present in more distant ancestors."},{"type":"fill","q":"What term describes a trait inherited from, and shared with, distant ancestors?","accept":["primitive trait","primitive"],"exp":"Primitive traits are the older, ancestral condition, as opposed to derived (newer) traits."},{"type":"tf","q":"An 'extant' lineage is one that is known only from fossils, with no living members today.","answer":false,"exp":"False — extant means the lineage has surviving members today, not just extinct ones."},{"type":"tf","q":"Land plants evolved from a broad range of algae, not from any one specific algal lineage.","answer":false,"exp":"False — land plants (embryophytes) evolved specifically from a charophyte-like green algal ancestor within the Streptophyta lineage, not from algae generally."},{"type":"mc","q":"In the phylogeny of Archaeplastida, which group is defined as the land plants?","opts":["Chlorophytes","Red algae","Embryophytes","Rhizarians"],"answer":2,"exp":"Embryophytes = Kingdom Plantae — the land plant lineage nested within Streptophyta."},{"type":"mc","q":"According to Figure 29.3, which lineage branches off earliest from the ancestral alga, separate from all other groups shown?","opts":["Chlorophytes","Red algae","Charophytes","Embryophytes"],"answer":1,"exp":"Red algae diverge first; the remaining lineage (Viridiplantae) later splits into Chlorophytes and Streptophyta."},{"type":"mc","q":"Viridiplantae is made up of which two lineages?","opts":["Red algae and Chlorophytes","Chlorophytes and Streptophyta","Streptophyta and Embryophytes","Red algae and Streptophyta"],"answer":1,"exp":"Viridiplantae splits into Chlorophytes and Streptophyta; Streptophyta in turn contains the land plants (Embryophytes)."},{"type":"mc","q":"What is the defining derived trait of Kingdom Plantae specifically (the feature that gives embryophytes their name)?","opts":["A dependent embryo that develops while attached to the parent plant","A rigid cell wall","Multicellularity","Photosynthesis"],"answer":0,"exp":"\"Embryophyte\" literally refers to the dependent embryo, nourished by the parent sporophyte — the trait that distinguishes Plantae from its algal relatives."},{"type":"fill","q":"In Kingdom Plantae, the sporophyte produces haploid spores from diploid cells called sporocytes, inside organs called what?","accept":["sporangia","sporangium"],"exp":"Sporangia are the organs where meiosis converts diploid sporocytes into haploid spores."},{"type":"list","q":"Using the 'Diversification of Plants' grade diagram, list the four major groupings of plants, from least to most derived.","model":"Nonvascular plants (Bryophytes); seedless vascular plants (Monilophytes/Lycophytes); 'naked seed' plants (Gymnosperms); and 'covered seed' plants with flowers and fruit (Angiosperms)."},{"type":"fill","q":"According to Table 29.1, how many known species of flowering plants (Phylum Anthophyta) are there?","accept":["250000","250,000","250 000"],"exp":"Phylum Anthophyta (flowering plants) contains roughly 250,000 known species — by far the most of any plant phylum."},{"type":"mc","q":"According to Table 29.1, which phylum has only 1 known living species?","opts":["Phylum Cycadophyta","Phylum Gnetophyta","Phylum Ginkgophyta","Phylum Coniferophyta"],"answer":2,"exp":"Phylum Ginkgophyta (Ginkgo) has exactly 1 known species."},{"type":"mc","q":"According to Table 29.1, which phylum has more known species — Lycophyta or Monilophyta?","opts":["Lycophyta, with about 12,000","Monilophyta, with about 12,000","They have roughly equal numbers","Lycophyta, with about 100"],"answer":1,"exp":"Monilophyta (ferns) has about 12,000 species, compared to about 1,200 for Lycophyta (lycophytes)."},{"type":"match","q":"Match each plant phylum from Table 29.1 to its approximate number of known species.","pairs":[["Phylum Hepatophyta (liverworts)","9,000"],["Phylum Bryophyta (mosses)","15,000"],["Phylum Anthocerophyta (hornworts)","100"],["Phylum Coniferophyta (conifers)","600"]],"exp":"These figures come directly from Table 29.1, Ten Phyla of Extant Plants."}]},{"category":"Nonvascular Plants (Bryophytes)","questions":[{"type":"match","q":"Match each bryophyte phylum to its common name.","pairs":[["Phylum Hepatophyta","Liverworts"],["Phylum Bryophyta","Mosses"],["Phylum Anthocerophyta","Hornworts"]],"exp":"These are the three nonvascular plant phyla from Table 29.1."},{"type":"mc","q":"Which of the following best describes bryophyte life cycles?","opts":["Dominated by the sporophyte (2n) generation","Dominated by the gametophyte (n) generation","Entirely diploid, with no alternation of generations","Entirely haploid, with no sporophyte stage at all"],"answer":1,"exp":"Unlike every other plant group, bryophyte life cycles are dominated by the haploid gametophyte; the sporophyte is small and depends on it."},{"type":"tf","q":"In bryophytes, the sporophyte generation is physically independent of the gametophyte.","answer":false,"exp":"False — the sporophyte grows directly out of, and remains dependent on, the gametophyte."},{"type":"list","q":"List the four ways bryophytes (phyla Bryophyta, Anthocerophyta, and Hepatophyta) differ from other plants.","model":"They are nonvascular; their life cycle is dominated by the gametophyte (n) rather than the sporophyte (2n); the sporophyte generation grows out of, and is dependent on, the gametophyte; and they lack true roots and true leaves."},{"type":"mc","q":"A bryophyte spore is best described as:","opts":["A diploid cell produced by fertilization","A haploid, unicellular reproductive cell, produced by meiosis, that can develop into a new organism without fusing with another cell","A multicellular diploid embryo","A pollen grain"],"answer":1,"exp":"Spores are unicellular and haploid, made by meiosis, and can develop into a gametophyte without fusing with another cell."},{"type":"fill","q":"What is the name of the tough, decay-resistant coating on spores (and later pollen) that prevents desiccation?","accept":["sporopollenin"],"exp":"Sporopollenin protects spores and pollen from drying out and decaying, and is highly resistant to decay."},{"type":"tf","q":"Spores divide by mitosis to become the multicellular gametophyte stage.","answer":true,"exp":"True — once a haploid spore lands somewhere suitable, mitosis builds it into the full multicellular gametophyte."},{"type":"mc","q":"Bryophyte spores are mainly dispersed through:","opts":["Water currents only","Dry air","Animal digestion","Pollinating insects"],"answer":1,"exp":"Spores are dispersed through dry air, unlike pollen which can rely on wind or animals over much greater distances."},{"type":"match","q":"Match each structure to its function.","pairs":[["Cuticle","Waxy, waterproof covering with antimicrobial properties that prevents dehydration"],["Stomata","Openings on the leaf surface that allow gas exchange despite the cuticle"],["Mycorrhizae","Mutualism between plant roots and fungi"]],"exp":"These three innovations all help a plant manage water balance and gas exchange on land."},{"type":"list","q":"Describe the mutualism of mycorrhizae: what does the plant get, and what does the fungus get?","model":"The plant benefits from increased absorption of water and minerals (such as phosphates); the fungus benefits from access to carbohydrates and other nutrients from the plant."},{"type":"list","q":"Walking through the moss life cycle, list the structures/events in order from spore release to spore release again.","model":"Spores are released and grow by mitosis into protonemata; these bud into male or female gametophytes; male gametophytes form antheridia (produce sperm), female gametophytes form archegonia (produce eggs); water is required for the sperm to swim to the egg; fertilization inside the archegonium produces a zygote (2n); the zygote grows into an embryo, then a young sporophyte, then a mature sporophyte (still attached to the female gametophyte) with a sporangium at the top of a stalk called the seta, anchored by a foot; meiosis inside the sporangium produces new haploid spores, completing the cycle."},{"type":"mc","q":"In the moss life cycle, where does fertilization take place?","opts":["Inside the sporangium","Inside the archegonium","Inside the antheridium","In open water away from the plant"],"answer":1,"exp":"Fertilization occurs within the archegonium, the female structure that houses the egg."},{"type":"tf","q":"Bryophytes require water in the environment for sperm to swim to the egg during fertilization.","answer":true,"exp":"True — this water dependency is a major limitation bryophytes share with seedless vascular plants, and one that seed plants eventually overcame."},{"type":"mc","q":"Which structure in the moss sporophyte is responsible for producing new spores via meiosis?","opts":["The foot","The seta","The sporangium (capsule)","The archegonium"],"answer":2,"exp":"Meiosis occurs inside the sporangium (capsule) at the top of the mature sporophyte, producing haploid spores."},{"type":"fill","q":"In the moss life cycle diagram, what is the name of the stalk that holds the sporangium (capsule) up above the gametophyte?","accept":["seta"],"exp":"The seta is the stalk connecting the foot (anchored in the gametophyte) to the sporangium."},{"type":"mc","q":"What is the role of the 'foot' structure in a moss sporophyte?","opts":["It produces spores by meiosis","It anchors and attaches the sporophyte to the gametophyte, allowing nutrient transfer","It produces sperm","It is the waxy waterproof covering"],"answer":1,"exp":"The foot physically and nutritionally connects the dependent sporophyte to the gametophyte it grows from."},{"type":"mc","q":"Antheridia and archegonia are found on which generation of the moss life cycle?","opts":["The sporophyte (2n) generation","The gametophyte (n) generation","Both generations equally","Neither — they are unique to ferns"],"answer":1,"exp":"Antheridia (sperm-producing) and archegonia (egg-producing) are gametophyte structures, consistent with the gametophyte being the dominant generation in mosses."}]},{"category":"Seedless Vascular Plants","questions":[{"type":"mc","q":"What major tissue type do seedless vascular plants have that bryophytes lack?","opts":["Cuticle","Vascular tissue (xylem and phloem)","Cell walls","Chlorophyll"],"answer":1,"exp":"The defining feature of vascular plants, including ferns and lycophytes, is the presence of xylem and phloem."},{"type":"match","q":"Match each seedless vascular plant phylum to its common name.","pairs":[["Phylum Lycophyta","Lycophytes"],["Phylum Monilophyta","Monilophytes (ferns)"]],"exp":"These are the two seedless vascular plant phyla from Table 29.1."},{"type":"fill","q":"What term describes the cone-like, spore-producing structures found in lycophytes, formed from groups of sporophylls?","accept":["strobili","strobilus"],"exp":"Strobili are formed from clusters of sporophylls (modified leaves bearing sporangia)."},{"type":"mc","q":"A sorus (plural: sori), found on the underside of fern fronds, is best described as:","opts":["A single spore","A cluster of sporangia","The fern's root system","A type of gametophyte"],"answer":1,"exp":"A sorus is a cluster of sporangia, the structures where spores are produced."},{"type":"fill","q":"What is the name for the young, coiled leaf of a fern, visible as it first emerges?","accept":["fiddlehead"],"exp":"The fiddlehead is the young, tightly-coiled leaf of a developing fern frond."},{"type":"tf","q":"In ferns, the sporophyte generation is small and dependent, while the gametophyte is the large, dominant plant.","answer":false,"exp":"False — this is backwards. In ferns, the sporophyte (with fronds and fiddleheads) is the large, dominant, independent plant, while the gametophyte is small and short-lived — the opposite of mosses."},{"type":"mc","q":"The fern gametophyte is described as homosporous and bisexual, meaning:","opts":["It produces two different spore types and has separate male/female gametophytes","It produces one spore type, and the resulting gametophyte has both antheridia and archegonia","It never produces spores at all","It is dependent on the sporophyte for nutrition"],"answer":1,"exp":"Homosporous means one spore type; bisexual means the resulting gametophyte carries both male (antheridia) and female (archegonia) structures."},{"type":"fill","q":"In the fern life cycle diagram, what anchoring structure is found on the underside of the small gametophyte (not a true root)?","accept":["rhizoid","rhizoids"],"exp":"Rhizoids anchor the fern gametophyte, functioning somewhat like roots without being true roots."},{"type":"tf","q":"Like mosses, ferns still require water in the environment for fertilization to occur.","answer":true,"exp":"True — fern sperm must still swim to the egg, so water dependency persists even though the sporophyte has become dominant."},{"type":"list","q":"Walking through the fern life cycle, list the key stages in order from spore to new sporophyte.","model":"Spore dispersal (n) occurs; a young gametophyte develops; the mature, bisexual gametophyte (anchored by rhizoids) forms antheridia and archegonia on its underside; water-dependent fertilization occurs; a zygote (2n) forms; it grows into a new sporophyte, which matures into the dominant, visible fern plant (emerging first as a fiddlehead), eventually producing sporangia (grouped into sori) that undergo meiosis to produce new spores."},{"type":"mc","q":"A sporophyll is best defined as:","opts":["A modified leaf that bears sporangia","A type of root hair","A pollen-producing structure unique to seed plants","The protective coat of a seed"],"answer":0,"exp":"Sporophylls are modified leaves specialized for carrying sporangia, as seen in lycophyte strobili."},{"type":"mc","q":"Which statement correctly describes spore vari
